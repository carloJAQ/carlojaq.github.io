<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d2b">
<title>AgroClima LP</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f5f2; --card:#ffffff; --ink:#1b1c1a; --ink2:#55574f; --ink3:#8a8c83; --line:#e2e3dd;
  --brand:#1f4d2b; --brand2:#2f6b3f; --accent:#2a78d6;
  --ok:#2e7d32; --warn:#b26a00; --warnbg:#fff4dc; --bad:#c62828; --badbg:#fdecea; --info:#1565c0; --infobg:#e8f1fc; --okbg:#e9f5ea;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;font-weight:650;letter-spacing:.2px}
header button{background:transparent;border:0;color:#fff;font-size:15px;padding:6px 8px;border-radius:8px}
#estadoNube{font-size:12px;opacity:.9;display:flex;align-items:center;gap:6px}
#estadoNube i{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}
main{padding:12px 12px 96px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:12px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--brand);font-weight:650}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card h2{font-size:15px;margin:0 0 10px;color:var(--ink);font-weight:650}
.card h3{font-size:14px;margin:12px 0 6px}
.muted{color:var(--ink2)} .small{font-size:13px} .tiny{font-size:12px;color:var(--ink3)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--bg);border-radius:10px;padding:9px 10px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink2)}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;background:var(--brand);color:#fff}
.btn.sec{background:#e7ebe4;color:var(--ink)}
.btn.peligro{background:var(--badbg);color:var(--bad)}
.btn.blk{width:100%}
.btn:disabled{opacity:.5}
label{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #cfd2c8;border-radius:10px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto;margin-right:6px}
textarea{min-height:64px}
.chk{display:flex;align-items:center;font-size:15px;color:var(--ink);margin:6px 0}
.badge{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12.5px;padding:4px 9px;border-radius:99px;white-space:nowrap}
.b-APLICAR{background:var(--bad);color:#fff}
.b-VIGILAR{background:var(--warnbg);color:var(--warn)}
.b-PROTEGIDO{background:var(--infobg);color:var(--info)}
.b-NO{background:var(--okbg);color:var(--ok)}
.b-SOLO{background:#eceee8;color:var(--ink2)}
.lote{cursor:pointer}
.lote .tit{font-weight:650;font-size:16px}
.enf{border-top:1px solid var(--line);padding:10px 0}
.enf:first-of-type{border-top:0}
.enf .nom{font-weight:650}
details summary{cursor:pointer;color:var(--accent);font-size:13px;margin-top:4px}
.det{font-size:13px;color:var(--ink2);margin-top:6px}
.det td{padding:2px 8px 2px 0}
.bar{height:8px;background:#e5e7e0;border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--brand2);border-radius:99px}
.vent{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.vent:first-child{border-top:0}
.tabla{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tabla th{text-align:right;font-weight:600;color:var(--ink2);padding:5px 4px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.tabla td{text-align:right;padding:5px 4px;border-bottom:1px solid #f0f1ec}
.tabla th:first-child,.tabla td:first-child{text-align:left}
.tabla tr.fut td{color:var(--ink3);font-style:italic}
.scroll{overflow:auto;max-height:420px}
.aviso{background:var(--warnbg);color:#6b4300;border-radius:10px;padding:10px;font-size:13.5px;margin:8px 0}
.error{background:var(--badbg);color:var(--bad);border-radius:10px;padding:10px;font-size:13.5px;margin:8px 0}
.okmsg{background:var(--okbg);color:var(--ok);border-radius:10px;padding:10px;font-size:13.5px;margin:8px 0}
.ahora{border-radius:12px;padding:12px;margin-bottom:8px}
.ahora.si{background:var(--okbg)} .ahora.no{background:var(--badbg)}
.ahora b{font-size:17px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:#1b1c1a;color:#fff;font-size:12px;padding:5px 8px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:2}
.vacio{text-align:center;color:var(--ink2);padding:30px 10px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1b1c1a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:20;max-width:90%}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:g .8s linear infinite;vertical-align:-2px}
@keyframes g{to{transform:rotate(360deg)}}
.etapas-ed .row{margin-bottom:6px}
.etapas-ed input{padding:8px}
a{color:var(--accent)}
.tag{display:inline-block;font-size:11.5px;font-weight:650;padding:1px 7px;border-radius:99px;background:#eceee8;color:var(--ink2);vertical-align:1px}
ul.lst{margin:4px 0 6px;padding-left:20px} ul.lst li{margin:4px 0}
.card p{margin:6px 0}
.tabla.izq th,.tabla.izq td{text-align:left;vertical-align:top}
.opt{display:block;width:100%;text-align:left;border:1px solid #cfd2c8;background:#fff;border-radius:10px;padding:11px 12px;margin:8px 0;font:inherit;color:var(--ink)}
.opt.bien{background:var(--okbg);border-color:var(--ok)} .opt.mal{background:var(--badbg);border-color:var(--bad)}
.pq{color:var(--ink);margin-top:8px;border:1px solid #dfe3d8;border-radius:10px;background:#fafbf7}
.pq summary{padding:8px 10px;font-size:13.5px;font-weight:650;color:var(--brand)}
.pqc{padding:0 12px 10px;font-size:13.5px}
.sub{font-weight:650;font-size:13px;margin:10px 0 4px;color:var(--ink)}
ul.pasos{list-style:none;padding:0;margin:4px 0}
ul.pasos li{position:relative;padding:3px 0 3px 22px;font-size:13px}
ul.pasos li::before{position:absolute;left:2px;top:3px;font-weight:700}
ul.pasos li.si::before{content:'✓';color:var(--ok)} ul.pasos li.no::before{content:'✗';color:var(--ink3)} ul.pasos li.info::before{content:'•';color:var(--ink2)}
ul.pasos li.fin{font-weight:650;padding-left:0}
.fund{font-size:12.5px;color:var(--ink2);margin-top:3px}
.fte{display:inline-block;font-size:11px;color:var(--ink3);border:1px solid #dcdfd6;border-radius:6px;padding:0 5px;margin-left:2px;white-space:nowrap}
.flash{min-height:200px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}
</style>
</head>
<body>
<header>
  <button id="btnAtras" style="display:none" aria-label="Volver">‹ Volver</button>
  <h1 id="titulo">AgroClima LP</h1>
  <div id="estadoNube"><i></i><span>Local</span></div>
</header>
<main id="vista"></main>
<nav>
  <button data-tab="inicio" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Lotes</button>
  <button data-tab="aqui"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>Aquí</button>
  <button data-tab="guia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 7h6"/></svg>Guía</button>
  <button data-tab="calc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg>Calcular</button>
  <button data-tab="mas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Más</button>
</nav>
<div id="toast"></div>
<script>
// ================= MODELOS AGROCLIMÁTICOS =================
// Funciones puras: no tocan pantalla ni red. Se pueden probar aparte.
const M = (() => {
  const r1 = x => Math.round(x * 10) / 10;

  // ---- Fechas (cadenas YYYY-MM-DD) ----
  const fd = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const difDias = (a, b) => Math.round((fd(b) - fd(a)) / 86400000); // b - a
  const sumarDias = (s, n) => { const t = new Date(fd(s) + n * 86400000); return t.toISOString().slice(0, 10); };

  // ---- Configuración por defecto (todo editable en la app) ----
  const CONFIG = {
    version: 2,
    papa: {
      base: 2, tope: 29, // método INIFAP (Sifuentes 2020), grados día por hora
      etapas: [
        { n: 'Plantación', gd: 0 },
        { n: 'Emergencia', gd: 250 },
        { n: 'Inicio de estolonización', gd: 350 },
        { n: 'Inicio de tuberización', gd: 450 },
        { n: 'Floración', gd: 620 },
        { n: 'Desarrollo de tubérculos (3-5 cm)', gd: 800 },
        { n: 'Tubérculos desarrollados (>5 cm)', gd: 1100 },
        { n: 'Senescencia', gd: 1450 },
        { n: 'Madurez', gd: 1700 }
      ],
      kc: [[0, 0.5], [250, 0.5], [620, 1.15], [1450, 1.15], [1700, 0.75]] // FAO-56
    },
    trigo: {
      base: 0, tope: 30,
      etapas: [
        { n: 'Siembra', gd: 0 },
        { n: 'Emergencia (Z10)', gd: 140 },
        { n: 'Tres hojas (Z13)', gd: 300 },
        { n: 'Inicio macolla (Z21)', gd: 400 },
        { n: 'Encañado (Z31)', gd: 800 },
        { n: 'Hoja bandera (Z39)', gd: 1050 },
        { n: 'Espigadura (Z55)', gd: 1250 },
        { n: 'Antesis (Z65)', gd: 1400 },
        { n: 'Grano lechoso (Z75)', gd: 1650 },
        { n: 'Grano pastoso (Z85)', gd: 1900 },
        { n: 'Madurez fisiológica (Z89)', gd: 2100 }
      ],
      kc: [[0, 0.4], [400, 0.4], [1050, 1.15], [1650, 1.15], [2100, 0.3]]
    },
    avena: {
      base: 0, tope: 30,
      etapas: [
        { n: 'Siembra', gd: 0 },
        { n: 'Emergencia (Z10)', gd: 140 },
        { n: 'Tres hojas (Z13)', gd: 300 },
        { n: 'Inicio macolla (Z21)', gd: 400 },
        { n: 'Encañado (Z31)', gd: 800 },
        { n: 'Hoja bandera (Z39)', gd: 1050 },
        { n: 'Panojamiento (Z55)', gd: 1250 },
        { n: 'Antesis (Z65)', gd: 1400 },
        { n: 'Grano lechoso (Z75)', gd: 1650 },
        { n: 'Grano pastoso (Z85)', gd: 1900 },
        { n: 'Madurez fisiológica (Z89)', gd: 2100 }
      ],
      kc: [[0, 0.4], [400, 0.4], [1050, 1.15], [1650, 1.15], [2100, 0.3]]
    },
    cebada: {
      base: 0, tope: 30,
      etapas: [
        { n: 'Siembra', gd: 0 },
        { n: 'Emergencia (Z10)', gd: 130 },
        { n: 'Tres hojas (Z13)', gd: 280 },
        { n: 'Inicio macolla (Z21)', gd: 370 },
        { n: 'Encañado (Z31)', gd: 720 },
        { n: 'Hoja bandera (Z39)', gd: 950 },
        { n: 'Espigadura (Z55)', gd: 1120 },
        { n: 'Antesis (Z65)', gd: 1250 },
        { n: 'Grano lechoso (Z75)', gd: 1480 },
        { n: 'Grano pastoso (Z85)', gd: 1700 },
        { n: 'Madurez fisiológica (Z89)', gd: 1900 }
      ],
      kc: [[0, 0.3], [370, 0.3], [950, 1.15], [1480, 1.15], [1900, 0.25]]
    },
    pulgonesCereal: { base: 3, umbral: 170 }, // IRAG: 170 GD sobre 3 °C para la segunda generación
    aplicacion: {
      vientoMax: 25,        // km/h — sobre esto NO se aplica
      horasSinLluvia: 3,    // sin lluvia desde la hora de aplicación hasta X horas después
      lluviaMinima: 0.2,    // mm/h que se considera lluvia
      tempMin: 3,
      tempMax: 28,
      horaIni: 7,
      horaFin: 20,
      horasMinVentana: 2
    },
    proteccion: {          // días que protege cada tipo de producto y lluvia que lo lava
      contacto: { dias: 7, lavadoMm: 25 },
      translaminar: { dias: 8, lavadoMm: 40 },
      sistemico: { dias: 10, lavadoMm: 0 } // 0 = no se lava
    },
    tizon: {
      inicioVS: 18,          // Blitecast: severidad acumulada desde emergencia para iniciar programa
      inicioDiasLluviosos: 10, // o 10 días favorables por lluvia seguidos
      intervaloAlto: 5,      // días entre aplicaciones con riesgo alto
      intervaloMedio: 7,
      ajusteResistente: -1,  // baja un nivel el riesgo en variedades resistentes
      usarSmith: true
    },
    alternaria: {
      inicioPdias: 300,      // P-días desde emergencia para iniciar
      fast7Alto: 6,          // suma 7 días severidad FAST
      fast7Medio: 3
    },
    botritis: {
      hrMin: 90, tMin: 12, tMax: 25,
      horasDiaFavorable: 10, // horas/día con HR alta y T favorable
      diasAlto: 2            // días favorables en ventana de 5 días (3 pasados + 2 pronóstico)
    },
    hr90: 90
  };

  // Etapas de referencia de INIFAP (Valle del Fuerte, Sinaloa), variedad Alpha, base 2 / 29 °C
  const PRESET_INIFAP_ALPHA = [
    { n: 'Plantación', gd: 0 }, { n: 'Brotación', gd: 344 }, { n: 'Emergencia', gd: 529 }, { n: 'Inicio de estolonización', gd: 903 },
    { n: 'Elongación de estolones', gd: 1032 }, { n: 'Inicio de tuberización', gd: 1188 }, { n: 'Desarrollo de tubérculos (3-5 cm)', gd: 1452 },
    { n: 'Tubérculos desarrollados (>5 cm)', gd: 1656 }, { n: 'Desvare', gd: 1835 }, { n: 'Cosecha', gd: 2258 }
  ];

  // ---- Horario -> diario ----
  // h = {time:[], t:[], rh:[], pp:[], ws:[], wg:[]} en hora local
  function diario(h, cfg) {
    const c = cfg || CONFIG;
    const dias = []; const idx = {};
    for (let i = 0; i < h.time.length; i++) {
      const t = h.t[i]; if (t == null) continue;
      const f = h.time[i].slice(0, 10);
      let d = idx[f];
      if (!d) { d = idx[f] = { fecha: f, n: 0, ts: 0, tmax: -99, tmin: 99, pp: 0, rhs: 0, nrh: 0, ws: 0, wg: 0, h90: 0, t90s: 0, hbot: 0, th: [], et0: 0, net0: 0 }; dias.push(d); }
      const rh = h.rh[i], pp = h.pp[i] || 0, ws = h.ws[i] || 0, wg = h.wg ? (h.wg[i] || 0) : 0;
      d.th.push(t); if (h.et0 && h.et0[i] != null) { d.et0 += h.et0[i]; d.net0++; }
      d.n++; d.ts += t; d.tmax = Math.max(d.tmax, t); d.tmin = Math.min(d.tmin, t); d.pp += pp;
      if (rh != null) { d.rhs += rh; d.nrh++; }
      d.ws = Math.max(d.ws, ws); d.wg = Math.max(d.wg, wg);
      if (rh != null && rh >= c.hr90) { d.h90++; d.t90s += t; }
      if (rh != null && rh >= c.botritis.hrMin && t >= c.botritis.tMin && t <= c.botritis.tMax) d.hbot++;
    }
    return dias.map(d => ({
      fecha: d.fecha,
      horas: d.n,
      tmax: r1(d.tmax), tmin: r1(d.tmin), tmed: r1(d.ts / d.n),
      pp: r1(d.pp),
      hr: d.nrh ? Math.round(d.rhs / d.nrh) : null,
      viento: r1(d.ws), rafaga: r1(d.wg),
      h90: d.h90, t90: d.h90 ? r1(d.t90s / d.h90) : null,
      hbot: d.hbot,
      th: d.th, et0: d.net0 ? r1(d.et0) : null
    }));
  }

  // ---- Grados día ----
  const gd = (tmax, tmin, base) => Math.max(0, (tmax + tmin) / 2 - base);
  // Método INIFAP: por hora, suma T − base entre base y tope; sobre el tope suma tope − base
  function gdHorario(th, base, tope) {
    if (!th || !th.length) return null;
    const tp = tope == null ? 99 : tope;
    let s = 0; for (const t of th) s += Math.max(0, Math.min(t, tp) - base);
    return s / th.length;
  }
  function kcEn(gdAc, pts) {
    if (!pts || !pts.length) return 1;
    if (gdAc <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) if (gdAc <= pts[i][0]) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; return y0 + (y1 - y0) * (gdAc - x0) / (x1 - x0); }
    return pts[pts.length - 1][1];
  }

  // ---- P-días (Sands et al. 1979), papa: Tmin 7, Topt 21, Tmax 30 ----
  function pT(T) {
    if (T < 7) return 0;
    if (T < 21) return 10 * (1 - Math.pow(T - 21, 2) / Math.pow(21 - 7, 2));
    if (T < 30) return 10 * (1 - Math.pow(T - 21, 2) / Math.pow(30 - 21, 2));
    return 0;
  }
  const pdia = (tmax, tmin) => (5 * pT(tmin) + 8 * pT((2 * tmin + tmax) / 3) + 8 * pT((tmin + 2 * tmax) / 3) + 3 * pT(tmax)) / 24;

  // ---- Tizón tardío: valores de severidad de Wallin (0–4) ----
  function wallin(h90, t90) {
    if (!h90 || t90 == null) return 0;
    let tb;
    if (t90 >= 7.2 && t90 < 11.7) tb = [16, 19, 22, 25];
    else if (t90 >= 11.7 && t90 < 15.1) tb = [13, 16, 19, 22];
    else if (t90 >= 15.1 && t90 <= 26.6) tb = [10, 13, 16, 19];
    else return 0;
    return tb.filter(x => h90 >= x).length;
  }

  // ---- Tizón temprano (Alternaria): severidad diaria FAST (Madden et al. 1978), simplificada ----
  function fast(h90, t90) {
    if (!h90 || t90 == null) return 0;
    let tb;
    if (t90 >= 13 && t90 < 18) tb = [7, 16, 21];
    else if (t90 >= 18 && t90 < 21) tb = [4, 9, 16, 23];
    else if (t90 >= 21 && t90 < 26) tb = [3, 6, 13, 21];
    else if (t90 >= 26 && t90 <= 29) tb = [4, 9, 16, 23];
    else return 0;
    return tb.filter(x => h90 >= x).length;
  }

  // ---- Matriz Blitecast (Krause, Massie y Hyre 1975) ----
  // -1 sin riesgo, 0 alerta, 1 intervalo normal, 2 intervalo corto
  function blitecast(vs7, dll7) {
    const col = vs7 <= 3 ? 0 : vs7 === 4 ? 1 : vs7 === 5 ? 2 : vs7 === 6 ? 3 : 4;
    const fila = dll7 < 5 ? [-1, -1, 0, 1, 2] : [-1, 0, 1, 2, 2];
    return fila[col];
  }

  // ---- Serie completa de un lote ----
  // dias: salida de diario() (ya con observaciones manuales mezcladas), ordenada
  function serie(dias, lote, cfg) {
    const c = cfg || CONFIG;
    const cult = c[lote.cultivo] || c.papa;
    const out = [];
    let gdA = 0, ppA = 0, pdA = 0, vsA = 0, etcA = 0;
    let fEm = lote.fecha_emergencia || null;
    const umbralEm = (cult.etapas[1] || { gd: 0 }).gd;
    for (let i = 0; i < dias.length; i++) {
      const d = Object.assign({}, dias[i]);
      if (d.fecha < lote.fecha_plantacion) continue;
      const gh = d.manualT ? null : gdHorario(d.th, cult.base, cult.tope);
      d.gd = r1(gh != null ? gh : gd(Math.min(d.tmax, cult.tope == null ? 99 : cult.tope), d.tmin, cult.base));
      gdA += d.gd; ppA += d.pp;
      d.kc = r1(kcEn(gdA, cult.kc) * 100) / 100;
      d.etc = d.et0 != null ? r1(d.et0 * d.kc) : null;
      etcA += d.etc || 0; d.etcAc = r1(etcA);
      d.t3 = r1(Math.max(0, d.tmed - c.pulgonesCereal.base));
      d.gdAc = r1(gdA); d.ppAc = r1(ppA);
      if (!fEm && gdA >= umbralEm) { fEm = d.fecha; d.emergeEstimada = true; }
      d.emergido = !!fEm && d.fecha >= fEm;
      d.vs = lote.cultivo === 'papa' ? wallin(d.h90, d.t90) : 0;
      d.fast = lote.cultivo === 'papa' ? fast(d.h90, d.t90) : 0;
      d.pd = lote.cultivo === 'papa' ? r1(pdia(d.tmax, d.tmin)) : 0;
      if (d.emergido) { pdA += d.pd; vsA += d.vs; }
      d.pdAc = r1(pdA); d.vsAc = vsA;
      d.botFav = d.hbot >= c.botritis.horasDiaFavorable;
      out.push(d);
    }
    // Días favorables por lluvia (Hyre): T media 5 días < 25,5 °C y lluvia 10 días >= 30 mm
    for (let i = 0; i < out.length; i++) {
      const a5 = out.slice(Math.max(0, i - 4), i + 1), a10 = out.slice(Math.max(0, i - 9), i + 1);
      const t5 = a5.reduce((s, x) => s + x.tmed, 0) / a5.length;
      const p10 = a10.reduce((s, x) => s + x.pp, 0);
      out[i].dll = t5 < 25.5 && p10 >= 30;
      // Período Smith (criterio Hutton): 2 días seguidos con Tmín >= 10 °C y >= 6 h con HR >= 90 %
      const ok = x => x && x.tmin >= 10 && x.h90 >= 6;
      out[i].smith = ok(out[i]) && ok(out[i - 1]);
    }
    return { dias: out, fechaEmergencia: fEm, emergenciaEstimada: !lote.fecha_emergencia && !!fEm };
  }

  // ---- Etapa fenológica ----
  function etapa(gdAc, lote, cfg, gdDiaProm, hoy) {
    const c = cfg || CONFIG;
    const et = (c[lote.cultivo] || c.papa).etapas;
    let i = 0; for (let k = 0; k < et.length; k++) if (gdAc >= et[k].gd) i = k;
    const sig = et[i + 1] || null;
    let fechaSig = null;
    if (sig && gdDiaProm > 0.3) fechaSig = sumarDias(hoy, Math.ceil((sig.gd - gdAc) / gdDiaProm));
    const pct = sig ? Math.round(100 * (gdAc - et[i].gd) / (sig.gd - et[i].gd)) : 100;
    return { actual: et[i].n, siguiente: sig ? sig.n : null, faltan: sig ? r1(sig.gd - gdAc) : 0, fechaSig, pct };
  }

  // ---- Protección de la última aplicación ----
  function proteccion(apps, enf, s, hoy, cfg) {
    const c = cfg || CONFIG;
    const lista = (apps || []).filter(a => (a.objetivo || '').split(',').includes(enf) && a.fecha <= hoy).sort((a, b) => a.fecha < b.fecha ? 1 : -1);
    const a = lista[0];
    if (!a) return { hay: false, protegido: false };
    const p = c.proteccion[a.tipo] || c.proteccion.contacto;
    const dias = difDias(a.fecha, hoy);
    const ppDesde = r1(s.filter(d => d.fecha > a.fecha && d.fecha <= hoy).reduce((t, d) => t + d.pp, 0));
    const lavado = p.lavadoMm > 0 && ppDesde >= p.lavadoMm;
    const protegido = dias < p.dias && !lavado;
    return { hay: true, app: a, dias, ppDesde, lavado, protegido, hasta: sumarDias(a.fecha, p.dias), lavadoMm: p.lavadoMm };
  }

  const ORDEN = { 'APLICAR': 4, 'VIGILAR': 3, 'PROTEGIDO': 2, 'NO APLICAR': 1, 'SOLO CLIMA': 0 };

  // Cada evaluación devuelve "pasos": el razonamiento con los números del lote, para aprender del modelo.
  const P = (t, est) => ({ t, est: est || '' }); // est: 'si' (se cumple), 'no', 'info'
  const fl = s => { const [y, m, d] = s.split('-'); return `${d}-${m}`; };
  function pasosProteccion(prot, lavMm) {
    if (!prot.hay) return [P('No hay aplicaciones registradas para esta enfermedad: el cultivo no está protegido.', 'no')];
    const r = [P(`Última aplicación: ${fl(prot.app.fecha)} (${prot.app.producto || 'producto'}, ${prot.app.tipo || 'contacto'}), hace ${prot.dias} días. Protege hasta el ${fl(prot.hasta)}.`, 'info')];
    if (prot.lavadoMm > 0) r.push(P(`Llovieron ${prot.ppDesde} mm desde la aplicación; con ${prot.lavadoMm} mm o más se considera lavada.`, prot.lavado ? 'no' : 'si'));
    else r.push(P(`Llovieron ${prot.ppDesde} mm desde la aplicación; un producto ${prot.app.tipo} ya absorbido no se lava.`, 'info'));
    r.push(P(prot.protegido ? 'Sigue protegido.' : 'Ya no protege.', prot.protegido ? 'si' : 'no'));
    return r;
  }

  // ---- Tizón tardío ----
  function evalTizon(s, lote, apps, hoy, cfg) {
    const c = cfg || CONFIG, T = c.tizon;
    const pas = s.filter(d => d.fecha <= hoy), fut = s.filter(d => d.fecha > hoy);
    const hd = pas[pas.length - 1];
    if (!hd || !hd.emergido) return { decision: 'NO APLICAR', motivo: 'El cultivo aún no emerge.', datos: {}, pasos: [P('Sin follaje no hay tejido que el tizón pueda infectar.', 'info')] };
    const ult7 = pas.slice(-7);
    const vs7 = ult7.filter(d => d.emergido).reduce((t, d) => t + d.vs, 0);
    const dll7 = ult7.filter(d => d.dll).length;
    let consec = 0, maxConsec = 0; for (const d of pas) { consec = d.dll ? consec + 1 : 0; maxConsec = Math.max(maxConsec, consec); }
    const smithDia = T.usarSmith ? pas.slice(-3).find(d => d.smith) : null;
    const smith = !!smithDia;
    const smithPronDia = T.usarSmith ? fut.slice(0, 3).find(d => d.smith) : null;
    const smithPron = !!smithPronDia;
    const prot = proteccion(apps, 'tizon', s, hoy, c);
    const iniciado = hd.vsAc >= T.inicioVS || maxConsec >= T.inicioDiasLluviosos || prot.hay;
    const nivelBase = blitecast(vs7, dll7);
    let nivel = nivelBase;
    if (lote.susceptibilidad === 'resistente') nivel = Math.max(-1, nivel + T.ajusteResistente);
    if (smith) nivel = Math.max(nivel, 1);
    const vsPron = fut.slice(0, 3).reduce((t, d) => t + d.vs, 0);
    const NIV = ['sin riesgo', 'alerta', 'riesgo medio', 'riesgo alto'];
    const dias7 = ult7.map(d => `${fl(d.fecha)}: ${d.h90} h HR≥90 a ${d.t90 != null ? d.t90 + ' °C' : '—'} → ${d.vs}`).join('; ');
    const pasos = [
      P(`1. Inicio del programa (Blitecast): se acumulan ${hd.vsAc} valores de severidad desde la emergencia (umbral ${T.inicioVS}), hubo ${maxConsec} días seguidos favorables por lluvia (umbral ${T.inicioDiasLluviosos})${prot.hay ? ' y ya hay aplicaciones registradas' : ''}.`, iniciado ? 'si' : 'no'),
      P(`2. Severidad de Wallin de los últimos 7 días: ${vs7}. Detalle: ${dias7}.`, 'info'),
      P(`3. Días favorables por lluvia en 7 días: ${dll7} (cuenta si la media de 5 días es < 25,5 °C y la lluvia de 10 días ≥ 30 mm).`, 'info'),
      P(`4. Matriz Blitecast con severidad ${vs7} y ${dll7} días lluviosos: ${NIV[nivelBase + 1]}.${lote.susceptibilidad === 'resistente' ? ` Variedad resistente: baja a ${NIV[Math.max(-1, nivelBase + T.ajusteResistente) + 1]}.` : ''}`, nivelBase >= 1 ? 'si' : 'no'),
      P(T.usarSmith ? (smith ? `5. Período Hutton/Smith el ${fl(smithDia.fecha)} (mínima ≥ 10 °C y ≥ 6 h con HR ≥ 90 % dos días seguidos): sube al menos a riesgo medio.` : '5. Sin período Hutton/Smith en los últimos 3 días.') : '5. El período Smith está desactivado en Ajustes.', smith ? 'si' : 'no'),
      P(`6. Pronóstico de 3 días: severidad ${vsPron}${smithPron ? ` y período Smith el ${fl(smithPronDia.fecha)}` : ''}.`, vsPron >= 3 || smithPron ? 'si' : 'no'),
      ...pasosProteccion(prot)
    ];
    const datos = { vs7, dll7, vsAc: hd.vsAc, smith, smithPron, vsPron, nivel, prot };
    let decision, motivo;
    if (!iniciado && !smith) {
      decision = nivel >= 0 || vsPron >= 3 ? 'VIGILAR' : 'NO APLICAR';
      motivo = `Programa aún no inicia: ${hd.vsAc} de ${T.inicioVS} valores de severidad desde emergencia.`;
    } else if (nivel >= 1) {
      const intervalo = nivel === 2 ? T.intervaloAlto : T.intervaloMedio;
      datos.intervalo = intervalo;
      pasos.push(P(`7. Con ${NIV[nivel + 1]} el intervalo entre aplicaciones es de ${intervalo} días.`, 'info'));
      if (prot.protegido && prot.dias < intervalo) { decision = 'PROTEGIDO'; motivo = `Riesgo ${nivel === 2 ? 'alto' : 'medio'}, pero la aplicación del ${prot.app.fecha} aún protege (${prot.dias} de ${intervalo} días).`; }
      else { decision = 'APLICAR'; motivo = smith ? 'Período Smith en los últimos 3 días: condiciones de infección.' : `Riesgo ${nivel === 2 ? 'alto' : 'medio'} (Blitecast): aplicar con intervalo de ${intervalo} días.`; if (prot.lavado) motivo += ` La lluvia (${prot.ppDesde} mm) lavó la aplicación anterior.`; }
    } else if (nivel === 0 || vsPron >= 3 || smithPron) {
      decision = prot.protegido ? 'PROTEGIDO' : 'VIGILAR';
      motivo = smithPron ? 'El pronóstico muestra un período Smith en los próximos 3 días.' : vsPron >= 3 ? `El pronóstico suma ${vsPron} valores de severidad en 3 días.` : 'Condiciones empiezan a ser favorables.';
    } else { decision = 'NO APLICAR'; motivo = 'Condiciones poco favorables para tizón tardío.'; }
    pasos.push(P(`Resultado: ${decision}.`, 'fin'));
    return { decision, motivo, datos, pasos };
  }

  // ---- Tizón temprano (Alternaria) ----
  function evalAlternaria(s, lote, apps, hoy, cfg) {
    const c = cfg || CONFIG, A = c.alternaria;
    const pas = s.filter(d => d.fecha <= hoy), fut = s.filter(d => d.fecha > hoy);
    const hd = pas[pas.length - 1];
    if (!hd || !hd.emergido) return { decision: 'NO APLICAR', motivo: 'El cultivo aún no emerge.', datos: {}, pasos: [P('Sin follaje no hay riesgo.', 'info')] };
    const u7 = pas.slice(-7);
    const f7 = u7.reduce((t, d) => t + d.fast, 0);
    const fPron = fut.slice(0, 3).reduce((t, d) => t + d.fast, 0);
    const prot = proteccion(apps, 'alternaria', s, hoy, c);
    const datos = { pdAc: hd.pdAc, fast7: f7, fastPron: fPron, prot };
    const pasos = [
      P(`1. P-días desde la emergencia: ${Math.round(hd.pdAc)} (el período susceptible parte a los ${A.inicioPdias}). Hoy sumó ${hd.pd} P-días con mínima ${hd.tmin} °C y máxima ${hd.tmax} °C.`, hd.pdAc >= A.inicioPdias ? 'si' : 'no')
    ];
    if (hd.pdAc < A.inicioPdias) { pasos.push(P('Resultado: NO APLICAR. El follaje todavía es joven y poco susceptible.', 'fin')); return { decision: 'NO APLICAR', motivo: `Faltan ${Math.round(A.inicioPdias - hd.pdAc)} P-días para iniciar (${Math.round(hd.pdAc)} de ${A.inicioPdias}).`, datos, pasos }; }
    pasos.push(P(`2. Severidad FAST de los últimos 7 días: ${f7} (media ≥ ${A.fast7Medio}, alta ≥ ${A.fast7Alto}). Detalle: ${u7.map(d => `${fl(d.fecha)}: ${d.h90} h húmedas a ${d.t90 != null ? d.t90 + ' °C' : '—'} → ${d.fast}`).join('; ')}.`, f7 >= A.fast7Medio ? 'si' : 'no'));
    pasos.push(P(`3. Pronóstico de 3 días: FAST ${fPron}.`, fPron >= A.fast7Medio ? 'si' : 'no'));
    pasos.push(...pasosProteccion(prot));
    let decision, motivo;
    if (f7 >= A.fast7Alto) { decision = prot.protegido ? 'PROTEGIDO' : 'APLICAR'; motivo = `Severidad FAST alta: ${f7} en 7 días.`; }
    else if (f7 >= A.fast7Medio || fPron >= A.fast7Medio) { decision = prot.protegido ? 'PROTEGIDO' : 'VIGILAR'; motivo = `Severidad FAST media: ${f7} en 7 días (pronóstico +${fPron}).`; }
    else { decision = 'NO APLICAR'; motivo = `Severidad FAST baja: ${f7} en 7 días. Cultivo ya en período susceptible.`; }
    if (decision === 'PROTEGIDO') motivo += ` Protegido por la aplicación del ${prot.app.fecha}.`;
    pasos.push(P(`Resultado: ${decision}.`, 'fin'));
    return { decision, motivo, datos, pasos };
  }

  // ---- Botritis ----
  function evalBotritis(s, lote, apps, hoy, cfg) {
    const c = cfg || CONFIG, B = c.botritis;
    const pas = s.filter(d => d.fecha <= hoy), fut = s.filter(d => d.fecha > hoy);
    const hd = pas[pas.length - 1];
    if (!hd || !hd.emergido) return { decision: 'NO APLICAR', motivo: 'El cultivo aún no emerge.', datos: {}, pasos: [P('Sin follaje no hay riesgo.', 'info')] };
    const v = pas.slice(-3).concat(fut.slice(0, 2));
    const nf = v.filter(d => d.botFav).length;
    const horas3 = pas.slice(-3).reduce((t, d) => t + d.hbot, 0);
    const prot = proteccion(apps, 'botritis', s, hoy, c);
    const datos = { diasFav: nf, horas3, prot };
    const pasos = [
      P(`1. Horas por día con HR ≥ ${B.hrMin} % y ${B.tMin}–${B.tMax} °C (3 días pasados y 2 de pronóstico): ${v.map(d => `${fl(d.fecha)}${d.fecha > hoy ? ' (pron.)' : ''}: ${d.hbot} h`).join('; ')}.`, 'info'),
      P(`2. Días favorables (${B.horasDiaFavorable} h o más): ${nf}. Con ${B.diasAlto} o más el riesgo es alto.`, nf >= B.diasAlto ? 'si' : 'no'),
      ...pasosProteccion(prot)
    ];
    let decision, motivo;
    if (nf >= B.diasAlto) { decision = prot.protegido ? 'PROTEGIDO' : 'APLICAR'; motivo = `${nf} días favorables (HR ≥ ${B.hrMin} % y ${B.tMin}–${B.tMax} °C por ${B.horasDiaFavorable} h o más) entre los últimos 3 y los próximos 2.`; }
    else if (nf === 1 || horas3 >= B.horasDiaFavorable) { decision = prot.protegido ? 'PROTEGIDO' : 'VIGILAR'; motivo = `${horas3} h favorables en los últimos 3 días.`; }
    else { decision = 'NO APLICAR'; motivo = 'Pocas horas con humedad alta.'; }
    if (decision === 'PROTEGIDO') motivo += ` Protegido por la aplicación del ${prot.app.fecha}.`;
    pasos.push(P(`Resultado: ${decision}.`, 'fin'));
    return { decision, motivo, datos, pasos };
  }

  // ---- Pulgones de cereales y BYDV (IRAG: 170 GD sobre 3 °C) ----
  function evalPulgonesCereal(s, lote, apps, hoy, cfg) {
    const c = cfg || CONFIG, PC = c.pulgonesCereal;
    const pas = s.filter(d => d.fecha <= hoy);
    const hd = pas[pas.length - 1];
    if (!hd || !hd.emergido) return { decision: 'NO APLICAR', motivo: 'El cultivo aún no emerge.', datos: {}, pasos: [P('Sin plantas emergidas los pulgones no colonizan.', 'info')] };
    const ult = (apps || []).filter(a => (a.objetivo || '').split(',').includes('pulgones') && a.fecha <= hoy).sort((a, b) => a.fecha < b.fecha ? 1 : -1)[0];
    const desde = ult ? ult.fecha : pas.find(d => d.emergido).fecha;
    const tramo = pas.filter(d => d.fecha > desde || (!ult && d.fecha === desde));
    const suma = r1(tramo.reduce((t, d) => t + d.t3, 0));
    const datos = { suma, desde, umbral: PC.umbral, porApp: !!ult };
    const pasos = [
      P(`1. Punto de partida: ${ult ? `la última aplicación contra pulgones (${fl(ult.fecha)})` : `la emergencia (${fl(desde)})`}.`, 'info'),
      P(`2. Cada día suma su temperatura media menos ${PC.base} °C. En ${tramo.length} días se acumulan ${Math.round(suma)} GD; hoy sumó ${hd.t3} (media ${hd.tmed} °C).`, 'info'),
      P(`3. A los ${PC.umbral} GD nace la segunda generación, que se dispersa desde los focos iniciales.`, suma >= PC.umbral ? 'si' : 'no')
    ];
    let r;
    if (suma >= PC.umbral) r = { decision: 'VIGILAR', motivo: `Se acumularon ${Math.round(suma)} GD (base ${PC.base} °C) desde ${ult ? 'la última aplicación' : 'la emergencia'}: ya se formaría la segunda generación de pulgones. Revisa el cultivo y, si hay colonias, aplica.` };
    else r = { decision: 'NO APLICAR', motivo: `Van ${Math.round(suma)} de ${PC.umbral} GD (base ${PC.base} °C) desde ${ult ? 'la última aplicación' : 'la emergencia'}.` };
    pasos.push(P(`Resultado: ${r.decision}.${r.decision === 'VIGILAR' ? ' El modelo supone que hay pulgones: confirma con un conteo antes de aplicar.' : ''}`, 'fin'));
    return Object.assign(r, { datos, pasos });
  }

  // ---- Rendimiento y proyección ----
  // papa: m = {largo_m, entre_hilera_m, plantas, tuberculos, peso_kg}; t/ha = peso / (largo × entrehilera) × 10
  function rendPapa(m) {
    const area = (+m.largo_m) * (+m.entre_hilera_m);
    if (!(area > 0) || !(+m.peso_kg >= 0)) return null;
    const tha = (+m.peso_kg) / area * 10;
    return { tha: r1(tha), tubPlanta: m.plantas ? r1(m.tuberculos / m.plantas) : null, pesoMedio: m.tuberculos ? Math.round(m.peso_kg * 1000 / m.tuberculos) : null, plantasHa: m.plantas ? Math.round(m.plantas / area * 10000) : null };
  }
  // cereal: kg/ha = espigas/m² × granos/espiga × PMG (g) / 100
  const rendCereal = (esp, gr, pmg) => (esp > 0 && gr > 0 && pmg > 0) ? Math.round(esp * gr * pmg / 100) : null;
  // Proyección con la tasa por grado día entre los dos últimos muestreos.
  // Supone que la tasa baja en forma lineal hasta cero en gdFin (madurez); gdCorto = horizonte corto sin caída.
  function proyeccion(puntos, gdObjetivo, gdFin, gdCorto) {
    const p = puntos.filter(x => x.tha != null && x.gdAc != null).sort((a, b) => a.gdAc - b.gdAc);
    if (p.length < 2 || gdObjetivo == null) return null;
    const a = p[p.length - 2], b = p[p.length - 1];
    if (b.gdAc <= a.gdAc) return null;
    const tasa = Math.max(0, (b.tha - a.tha) / (b.gdAc - a.gdAc));
    const X = Math.max(1, (gdFin == null ? gdObjetivo : gdFin) - b.gdAc);
    const D = Math.max(0, Math.min(gdObjetivo, b.gdAc + X) - b.gdAc);
    const tha = b.tha + tasa * (D - D * D / (2 * X));
    const corto = gdCorto ? r1(b.tha + tasa * gdCorto) : null;
    return { tasaGD: Math.round(tasa * 1000) / 1000, tha: r1(tha), corto, desde: b };
  }

  // ---- Rotación de grupos ----
  function rotacion(apps, grupo, objetivo, fecha) {
    if (!grupo) return null;
    const norm = g => String(g || '').split(/[ (]/)[0].trim().toUpperCase();
    const g0 = norm(grupo);
    const prev = (apps || []).filter(a => a.grupo && (!fecha || a.fecha <= fecha) && (!objetivo || (a.objetivo || '').split(',').some(o => objetivo.split(',').includes(o)))).sort((a, b) => a.fecha < b.fecha ? 1 : -1);
    const mismo = prev.filter(a => norm(a.grupo) === g0).length;
    const ultimo = prev[0] || null;
    const multisitio = /^M\d|^P07/.test(g0);
    return { repite: !!ultimo && norm(ultimo.grupo) === g0 && !multisitio, ultimo, vecesGrupo: mismo, multisitio };
  }

  // ---- Ventanas de aplicación (pronóstico horario) ----
  function evalHora(h, i, cfg) {
    const A = (cfg || CONFIG).aplicacion;
    const hora = +h.time[i].slice(11, 13);
    const motivos = [];
    if (hora < A.horaIni || hora >= A.horaFin) motivos.push('fuera de horario');
    if ((h.ws[i] || 0) >= A.vientoMax) motivos.push(`viento ${Math.round(h.ws[i])} km/h`);
    let ll = 0; for (let k = i; k <= Math.min(h.time.length - 1, i + A.horasSinLluvia); k++) ll += h.pp[k] || 0;
    if (ll >= A.lluviaMinima) motivos.push(`lluvia ${r1(ll)} mm próximas ${A.horasSinLluvia} h`);
    if (h.t[i] != null && h.t[i] < A.tempMin) motivos.push(`temperatura ${Math.round(h.t[i])} °C (baja)`);
    if (h.t[i] != null && h.t[i] > A.tempMax) motivos.push(`temperatura ${Math.round(h.t[i])} °C (alta)`);
    return { ok: motivos.length === 0, motivos };
  }

  function ventanas(h, ahora, cfg, horasAdelante) {
    const A = (cfg || CONFIG).aplicacion;
    const lim = horasAdelante || 72;
    let i0 = h.time.findIndex(t => t >= ahora); if (i0 < 0) return { lista: [], ahora: null };
    const ahoraEval = evalHora(h, i0, cfg);
    const lista = []; let cur = null;
    const bloq = { viento: 0, lluvia: 0, temp: 0 };
    for (let i = i0; i < Math.min(h.time.length, i0 + lim); i++) {
      const e = evalHora(h, i, cfg);
      const enHorario = !e.motivos.includes('fuera de horario');
      if (enHorario && !e.ok) { for (const m of e.motivos) { if (m.startsWith('viento')) bloq.viento++; else if (m.startsWith('lluvia')) bloq.lluvia++; else if (m.startsWith('temp')) bloq.temp++; } }
      if (e.ok) {
        if (!cur) cur = { ini: h.time[i], fin: h.time[i], horas: 0, vmax: 0, tmin: 99, tmax: -99 };
        cur.fin = h.time[i]; cur.horas++; cur.vmax = Math.max(cur.vmax, h.ws[i] || 0);
        cur.tmin = Math.min(cur.tmin, h.t[i]); cur.tmax = Math.max(cur.tmax, h.t[i]);
      } else if (cur) { if (cur.horas >= A.horasMinVentana) lista.push(cur); cur = null; }
    }
    if (cur && cur.horas >= A.horasMinVentana) lista.push(cur);

  let yUlt = -99;
  (op.marcas || []).filter(m => m.y <= ymax).sort((a, b) => a.y - b.y).forEach(m => {
    s += `<line x1="${L}" x2="${W - R}" y1="${Y(m.y)}" y2="${Y(m.y)}" stroke="#b9bbb2" stroke-dasharray="3 3" stroke-width="1"/>`;
    if (Math.abs(Y(m.y) - yUlt) >= 12) { s += `<text x="${L + 4}" y="${Y(m.y) - 3}" font-size="9.5" fill="#55574f">${esc(m.n)}</text>`; yUlt = Y(m.y); }
  });
  if (op.tipo === 'barra') {
    datos.forEach((d, i) => { if (d.y > 0) { const w = Math.max(1.5, bw - 2), y = Y(d.y), h = H - B - y; s += `<rect x="${X(i) - w / 2}" y="${y}" width="${w}" height="${h}" rx="${Math.min(3, w / 2)}" fill="${d.fut ? '#9dc0eb' : '#2a78d6'}"/>`; } });
  } else {
    const pts = datos.map((d, i) => `${X(i)},${Y(d.y)}`);
    const iFut = hoyI > 0 ? hoyI : n;
    s += `<polyline points="${pts.slice(0, iFut).join(' ')}" fill="none" stroke="#2f6b3f" stroke-width="2" stroke-linejoin="round"/>`;
    if (iFut < n) s += `<polyline points="${pts.slice(iFut - 1).join(' ')}" fill="none" stroke="#2f6b3f" stroke-width="2" stroke-dasharray="4 3"/>`;
  }
  s += `<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="#cfd2c8"/>`;
  const cada = Math.ceil(n / 6);
  datos.forEach((d, i) => { if (i % cada === 0) s += `<text x="${X(i)}" y="${H - 6}" font-size="9.5" text-anchor="middle" fill="#8a8c83">${+d.x.slice(8, 10)}/${+d.x.slice(5, 7)}</text>`; });
  s += `<line class="cur" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#1b1c1a" stroke-width="1" style="display:none"/>`;
  s += `<rect class="hit" x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/></svg>`;
  const id = 'g' + Math.random().toString(36).slice(2);
  setTimeout(() => {
    const box = document.getElementById(id); if (!box) return;
    const svg = box.querySelector('svg'), tip = box.querySelector('.tip'), cur = svg.querySelector('.cur');
    const mover = ev => {
      const r = svg.getBoundingClientRect(); const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
      const vx = px * W / r.width; const i = Math.max(0, Math.min(n - 1, Math.floor((vx - L) / bw)));
      const d = datos[i]; cur.setAttribute('x1', X(i)); cur.setAttribute('x2', X(i)); cur.style.display = '';
      tip.innerHTML = `${fFecha(d.x)}${d.fut ? ' (pron.)' : ''}: <b>${n1(d.y)} ${op.unidad || ''}</b>`; tip.style.display = 'block';
      tip.style.left = Math.max(60, Math.min(r.width - 60, X(i) * r.width / W)) + 'px'; tip.style.top = (Y(d.y) * r.height / H) + 'px';
    };
    const salir = () => { tip.style.display = 'none'; cur.style.display = 'none'; };
    svg.addEventListener('pointermove', mover); svg.addEventListener('pointerdown', mover); svg.addEventListener('pointerleave', salir);
  }, 0);
  return `<div class="chart" id="${id}">${s}<div class="tip"></div></div>`;
}

function cargarResumenes(lotes, forzar) {

function motivoTipo(m) { return m.startsWith('viento') ? 'viento' : m.startsWith('lluvia') ? 'lluvia' : m.includes('(alta)') ? 'tempAlta' : m.includes('(baja)') ? 'tempBaja' : 'horario'; }
function htmlAhora(ven) {
  if (!ven || !ven.ahora) return '<div class="tiny">Sin pronóstico horario.</div>';
  const a = ven.ahora, fuera = a.motivos.length === 1 && a.motivos[0] === 'fuera de horario';
  const mot = a.motivos.filter(m => m !== 'fuera de horario');
  const A = CFG.aplicacion;
  const crit = [
    ['viento', `Viento ${n0(a.viento)} km/h, límite ${A.vientoMax} km/h${a.rafaga != null ? ` (ráfagas ${n0(a.rafaga)})` : ''}`, (a.viento || 0) < A.vientoMax],
    ['lluvia', `Sin lluvia en las próximas ${A.horasSinLluvia} h`, !a.motivos.some(m => m.startsWith('lluvia'))],
    [a.t > A.tempMax ? 'tempAlta' : 'tempBaja', `Temperatura ${n1(a.t)} °C, rango ${A.tempMin}–${A.tempMax} °C`, a.t >= A.tempMin && a.t <= A.tempMax],
    ['horario', `Horario ${A.horaIni}:00–${A.horaFin}:00`, !fuera && !a.motivos.includes('fuera de horario')]
  ];
  const expl = `<ul class="pasos">${crit.map(([k, t, ok]) => `<li class="${ok ? 'si' : 'no'}">${esc(t)}${!ok ? `<div class="fund">${fundTxt(G.FUND.ventana[k])}</div>` : ''}</li>`).join('')}</ul>
    <div class="fund">${fundTxt(G.FUND.ventana.hr)} Ahora la HR es de ${n0(a.rh)} %.</div>
    ${a.ok ? `<div class="fund">${fundTxt(G.FUND.ventana.viento)}</div>` : ''}`;
  return `<div class="ahora ${a.ok ? 'si' : 'no'}"><b>${a.ok ? '✓ Ahora SÍ se puede aplicar' : fuera ? '– Ahora: fuera del horario de aplicación' : '✕ Ahora NO se puede aplicar'}</b>
  <div class="small" style="margin-top:4px">Viento ${n0(a.viento)} km/h${a.rafaga != null ? ` (ráfagas ${n0(a.rafaga)})` : ''} · ${n1(a.t)} °C · HR ${n0(a.rh)} %</div>
  ${mot.length ? `<div class="small" style="margin-top:4px">Motivo: ${esc(mot.join(', '))}</div>` : ''}</div>${porque('', expl)}`;
}
function htmlVentanas(ven) {

  if (!ven.lista.length) {

function guiaEtapa(cultivo, nombre) { const lista = G.ETAPAS_GUIA[cultivo === 'papa' ? 'papa' : 'cereal']; return nombre ? (lista.find(e => e.re.test(nombre)) || null) : null; }

function htmlCrecimiento(l, A) {

    const hoy = hoyStr();

      const ultEt = cult.etapas[cult.etapas.length - 1];
      const hd = A.hd; gdObj = ultEt.gd; etiq = `a ${ultEt.n.toLowerCase()}`;
      if (hd && A.gdProm > 0.3 && ultEt.gd > hd.gdAc) fechaObj = M.sumarDias(hoy, Math.ceil((ultEt.gd - hd.gdAc) / A.gdProm));
    }
    const gdFin = cult.etapas[cult.etapas.length - 1].gd;
    const ult = pts[pts.length - 1];
    const gdCorto = ult && ult.gdAc != null ? Math.max(0, gdEnFecha(A, M.sumarDias(hoy, 14)) - ult.gdAc) : null;
    const pr = M.proyeccion(pts, gdObj, gdFin, gdCorto);
    if (pr) h += `<div class="okmsg">En 14 días, al ritmo actual: <b>${n1(pr.corto)} t/ha</b>.<br>Proyección ${etiq}${fechaObj ? ` (≈ ${fFechaL(fechaObj)})` : ''}: <b>${n1(pr.tha)} t/ha</b>.</div><div class="tiny">Tasa entre los dos últimos muestreos: ${n1(pr.tasaGD * 100)} t/ha cada 100 GD. Para la cosecha se supone que el llenado se frena de a poco hasta detenerse en ${esc(cult.etapas[cult.etapas.length - 1].n.toLowerCase())}. Mientras más muestreos, mejor la estimación.</div>`;
    else if (pts.length === 1) h += `<div class="tiny" style="margin-top:6px">Con un segundo muestreo la app calcula la tasa de llenado y la proyección.</div>`;
    if (pts.length >= 2) h += `<div style="margin-top:8px">${grafico(pts.map(p => ({ x: p.fecha, y: p.tha || 0 })), { tipo: 'linea', unidad: 't/ha', titulo: 'Rendimiento por muestreo' })}</div>`;
    const u = pts[pts.length - 1], pa = pts[pts.length - 2];
    let calc = u && u.tha != null ? `<div class="sub">Cálculo del último muestreo</div><div class="small">t/ha = ${n1(u.peso_kg)} kg ÷ (${n1(u.largo_m)} m × ${(u.entre_hilera_m || l.distancia_hileras_m || 0).toLocaleString('es-CL')} m) × 10 = <b>${n1(u.tha)} t/ha</b>. Se cosechó una superficie de ${n1(u.largo_m * (u.entre_hilera_m || l.distancia_hileras_m || 0))} m² y se lleva a hectárea (10.000 m²).</div>` : '';
    if (pr && pa) calc += `<div class="small" style="margin-top:6px">Tasa = (${n1(u.tha)} − ${n1(pa.tha)}) t/ha ÷ (${n0(u.gdAc)} − ${n0(pa.gdAc)}) GD = ${(Math.round(pr.tasaGD * 1000) / 1000).toLocaleString('es-CL')} t/ha por GD.</div>`;
    h += porque('proyección', calc + fundLista(G.FUND.proyeccion));
  } else {
    h += `<table class="tabla" style="margin-top:8px"><tr><th>Fecha</th><th>Espigas/m²</th><th>Granos/esp.</th><th>PMG g</th><th>kg/ha</th></tr>${pts.map(p => `<tr data-muestreo="${p.id}" style="cursor:pointer"><td>${fFechaL(p.fecha)}</td><td>${n0(p.espigas_m2)}</td><td>${n0(p.granos_espiga)}</td><td>${n1(p.pmg)}</td><td><b>${n0(p.kgha)}</b></td></tr>`).join('')}</table>`;
  }
  return h + '</div>';
}

function quiz(preguntas, titulo, clave) {
  let i = 0, ok = 0;
  const ps = preguntas.map(q => { const ord = barajar(q.o.map((t, k) => ({ t, k }))); return Object.assign({}, q, { ord }); });
  const pintar = () => {
    if (i >= ps.length) {
      const pct = Math.round(100 * ok / ps.length);
      if (clave) { const m = LS.get('ac_quiz', {}); if (m[clave] == null || pct > m[clave]) { m[clave] = pct; LS.set('ac_quiz', m); } }
      V().innerHTML = `<div class="card vacio"><div style="font-size:34px;font-weight:700">${ok} / ${ps.length}</div><div>${pct >= 80 ? 'Muy bien.' : pct >= 50 ? 'Vas bien; repasa las fichas de las que fallaste.' : 'Repasa las fichas y vuelve a intentarlo.'}</div><button class="btn blk" id="q_r" style="margin-top:14px">Otra ronda</button></div>`;

    }

    V().innerHTML = `<div class="card"><div class="tiny">${esc(titulo)} · ${i + 1} de ${ps.length}</div><h2 style="margin-top:6px;font-size:16px">${esc(q.p)}</h2>${q.ord.map(o => `<button class="opt" data-k="${o.k}">${esc(o.t)}</button>`).join('')}<div id="q_fb"></div></div>`;
    V().querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const k = +b.dataset.k, bien = k === q.r; if (bien) ok++;
      V().querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.k === q.r) x.classList.add('bien'); else if (x === b) x.classList.add('mal'); });
      $('#q_fb').innerHTML = `<div class="${bien ? 'okmsg' : 'error'}"><b>${bien ? 'Correcto.' : 'No es esa.'}</b> ${esc(q.e)}</div>${q.f ? `<a href="#" class="small" data-ficha="${q.f}">Ver ficha</a>` : ''}<button class="btn blk" id="q_n" style="margin-top:10px">${i + 1 < ps.length ? 'Siguiente' : 'Ver resultado'}</button>`;
      $('#q_n').onclick = () => { i++; pintar(); };
    });
  };
  pintar();
}

// ---------- Vista: Clima aquí (GPS actual) ----------
async function vAqui() {
  V().innerHTML = `<div class="card vacio"><span class="spin"></span> Buscando tu ubicación…</div>`;
  let p;
  try { p = await pedirGPS(); }
  catch (e) { V().innerHTML = `<div class="error">${esc(e.message)}</div><button class="btn blk" id="re">Reintentar</button>`; $('#re').onclick = vAqui; return; }
  V().innerHTML = `<div class="card vacio"><span class="spin"></span> Descargando pronóstico…</div>`;
  try {
    const h = await traerClima(p.lat, p.lon, M.sumarDias(hoyStr(), -1), 4);
    const ven = M.ventanas(h, ahoraStr(), CFG, 72);
    const dias = M.diario(h, CFG).filter(d => d.fecha >= hoyStr());
    V().innerHTML = `<div class="card"><div class="small muted">Punto ${p.lat}, ${p.lon} (± ${p.prec} m) · <a href="https://www.google.com/maps?q=${p.lat},${p.lon}" target="_blank" rel="noopener">mapa</a></div>
      <h2 style="margin-top:8px">¿Se puede aplicar aquí?</h2>${htmlAhora(ven)}<h3>Ventanas próximas 72 h</h3>${htmlVentanas(ven)}</div>
      <div class="card"><h2>Pronóstico</h2><table class="tabla"><tr><th>Día</th><th>Mín</th><th>Máx</th><th>mm</th><th>Viento máx</th><th>Ráfagas</th></tr>${dias.map(d => `<tr><td>${fFecha(d.fecha)}</td><td>${n0(d.tmin)}°</td><td>${n0(d.tmax)}°</td><td>${n1(d.pp)}</td><td>${n0(d.viento)}</td><td>${n0(d.rafaga)}</td></tr>`).join('')}</table></div>
      <button class="btn sec blk" id="crear">Crear lote en este punto</button>`;
    $('#crear').onclick = () => { ir(() => { vLoteForm(null); $('#f_lat').value = p.lat; $('#f_lon').value = p.lon; $('#f_lat').oninput(); }, 'Nuevo lote', true); };
  } catch (e) { V().innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}

    <div class="tiny" style="margin-top:4px">Está en Supabase → Project Settings → API → anon public. Es la misma de la app Registro LP.</div>
    <div class="row" style="margin-top:10px"><button class="btn grow" id="s_g">Guardar y probar</button><button class="btn sec grow" id="s_s">Sincronizar</button></div><div id="s_msg"></div></div>

    <div class="card"><h2>Criterios de aplicación</h2><div class="grid2">
    ${campo('aplicacion.vientoMax', 'Viento máximo (km/h)')}${campo('aplicacion.horasSinLluvia', 'Horas sin lluvia después')}
    ${campo('aplicacion.tempMin', 'Temperatura mínima (°C)')}${campo('aplicacion.tempMax', 'Temperatura máxima (°C)')}
    ${campo('aplicacion.horaIni', 'Hora inicio')}${campo('aplicacion.horaFin', 'Hora término')}
    ${campo('aplicacion.horasMinVentana', 'Horas mínimas de ventana')}${campo('aplicacion.lluviaMinima', 'Lluvia que cuenta (mm)', 0.1)}</div></div>

    <div class="card"><h2>Protección de productos</h2><div class="tiny">Días que protege y lluvia acumulada que lo lava (0 = no se lava).</div>
    ${Object.keys(TIPOS).map(t => `<div class="grid2">${campo(`proteccion.${t}.dias`, `${TIPOS[t]}: días`)}${campo(`proteccion.${t}.lavadoMm`, `${TIPOS[t]}: lavado (mm)`)}</div>`).join('')}</div>

    <div class="card"><h2>Tizón tardío</h2><div class="grid2">
    ${campo('tizon.inicioVS', 'Severidad para iniciar programa')}${campo('tizon.inicioDiasLluviosos', 'o días favorables seguidos')}
    ${campo('tizon.intervaloAlto', 'Intervalo riesgo alto (días)')}${campo('tizon.intervaloMedio', 'Intervalo riesgo medio (días)')}</div>
    <label class="chk"><input type="checkbox" id="smith" ${CFG.tizon.usarSmith ? 'checked' : ''}>Usar también el período Smith</label></div>

    <div class="card"><h2>Tizón temprano (Alternaria)</h2><div class="grid2">
    ${campo('alternaria.inicioPdias', 'P-días para iniciar')}${campo('alternaria.fast7Alto', 'FAST 7 días: alto')}${campo('alternaria.fast7Medio', 'FAST 7 días: medio')}</div></div>

    <div class="card"><h2>Botritis</h2><div class="grid2">
    ${campo('botritis.hrMin', 'HR mínima (%)')}${campo('botritis.horasDiaFavorable', 'Horas/día favorables')}
    ${campo('botritis.tMin', 'T mínima (°C)')}${campo('botritis.tMax', 'T máxima (°C)')}${campo('botritis.diasAlto', 'Días favorables = alto')}</div></div>

    <div class="card"><h2>Pulgones de cereales (BYDV)</h2><div class="grid2">
    ${campo('pulgonesCereal.base', 'Temperatura base (°C)', 0.5)}${campo('pulgonesCereal.umbral', 'GD para la segunda generación')}</div></div>

    <div class="card"><h2>Etapas fenológicas (grados día)</h2>
    <select id="e_c">${Object.entries(CULTIVOS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
    <div id="e_box" class="etapas-ed"></div></div>

    <div class="row" style="margin-bottom:12px"><button class="btn grow" id="c_g">Guardar parámetros</button><button class="btn sec" id="c_r">Restaurar</button></div>
    <details class="card"><summary>Cómo calcula la app</summary><div class="small" style="margin-top:8px">
    <p><b>Clima:</b> datos horarios de Open-Meteo para el punto GPS (pasado desde la plantación y pronóstico 7 días). Tu pluviómetro reemplaza la lluvia del día.</p>
    <p><b>Grados día:</b> por hora (método INIFAP), sumando T − base entre la base y el tope, desde la plantación o siembra. Papa: base 2 °C y tope 29 °C; cereales: base 0 °C. Las etapas del sur son estimadas: ajústalas con tus registros.</p>
    <p><b>Pulgones de cereales:</b> 170 GD sobre 3 °C desde la emergencia o la última aplicación (IRAG).</p>
    <p><b>Balance hídrico:</b> lluvia menos ET₀ × Kc (FAO-56).</p>
    <p><b>Tizón tardío:</b> valores de severidad de Wallin (horas con HR ≥ 90 % y su temperatura) y matriz Blitecast con días favorables por lluvia. Se inicia al llegar a 18 de severidad desde emergencia. Además marca el período Smith: 2 días seguidos con mínima ≥ 10 °C y 6 h o más con HR ≥ 90 %.</p>
    <p><b>Tizón temprano:</b> P-días (Sands) desde emergencia; inicia a los 300. Luego mide la severidad FAST de los últimos 7 días.</p>
    <p><b>Botritis:</b> cuenta horas con HR ≥ 90 % y 12–25 °C. Un día es favorable con 10 h o más.</p>
    <p><b>Protección:</b> la última aplicación protege por los días del tipo de producto, salvo que la lluvia acumulada la lave.</p>
    <p><b>Ventana:</b> horas con viento bajo el máximo (25 km/h), sin lluvia en las horas siguientes y temperatura dentro del rango.</p>
    <p class="tiny">Es un apoyo a la decisión, no reemplaza el monitoreo en terreno.</p></div></details>`;
  const pintarEtapas = () => {
    const c = $('#e_c').value, cu = CFG[c];
    $('#e_box').innerHTML = `<div class="grid2"><div><label>Temperatura base (°C)</label><input type="number" step="0.5" id="e_base" value="${cu.base}"></div><div><label>Temperatura tope (°C)</label><input type="number" step="0.5" id="e_tope" value="${cu.tope ?? ''}"></div></div>
      <div class="tiny">Grados día por hora (método INIFAP): suma T − base entre la base y el tope.</div>
      ${c === 'papa' ? '<button class="btn sec blk" id="e_inifap" style="margin-top:8px">Usar etapas INIFAP (Sinaloa, Alpha)</button><button class="btn sec blk" id="e_sur" style="margin-top:8px">Volver a etapas estimadas del sur</button>' : ''}
      <label>Etapas (nombre y GD acumulados)</label>${cu.etapas.map((e, i) => `<div class="row"><input class="grow" data-en="${i}" value="${esc(e.n)}"><input style="width:90px" type="number" data-eg="${i}" value="${e.gd}"></div>`).join('')}
      <div class="row"><button class="btn sec grow" id="e_add">+ Etapa</button><button class="btn sec grow" id="e_del">− Última</button></div>`;
    if (c === 'papa') {
      $('#e_inifap').onclick = () => { cu.base = 2; cu.tope = 29; cu.etapas = clon(M.PRESET_INIFAP_ALPHA); pintarEtapas(); toast('Etapas INIFAP cargadas: recuerda Guardar'); };
      $('#e_sur').onclick = () => { cu.base = M.CONFIG.papa.base; cu.tope = M.CONFIG.papa.tope; cu.etapas = clon(M.CONFIG.papa.etapas); pintarEtapas(); toast('Etapas del sur cargadas: recuerda Guardar'); };
    }
    $('#e_add').onclick = () => { leerEtapas(); cu.etapas.push({ n: 'Nueva etapa', gd: (cu.etapas[cu.etapas.length - 1] || { gd: 0 }).gd + 100 }); pintarEtapas(); };
    $('#e_del').onclick = () => { leerEtapas(); if (cu.etapas.length > 2) cu.etapas.pop(); pintarEtapas(); };
  };
  const leerEtapas = () => {
    const c = $('#e_c').value, cu = CFG[c]; if (!$('#e_base')) return;
    cu.base = +$('#e_base').value; cu.tope = $('#e_tope').value === '' ? null : +$('#e_tope').value;
    cu.etapas = cu.etapas.map((e, i) => ({ n: (document.querySelector(`[data-en="${i}"]`) || {}).value || e.n, gd: +((document.querySelector(`[data-eg="${i}"]`) || {}).value ?? e.gd) })).sort((a, b) => a.gd - b.gd);
  };
  let cAct = 'papa';
  $('#e_c').onchange = () => { const nuevo = $('#e_c').value; $('#e_c').value = cAct; leerEtapas(); $('#e_c').value = nuevo; cAct = nuevo; pintarEtapas(); };
  pintarEtapas();
  $('#s_g').onclick = async () => {
    SB = { url: $('#s_url').value.trim(), key: $('#s_key').value.trim() }; LS.set('ac_sb', SB);
    $('#s_msg').innerHTML = '<div class="tiny"><span class="spin"></span> Probando…</div>';
    try { await sb('GET', 'ac_lotes?select=id&limit=1'); $('#s_msg').innerHTML = '<div class="okmsg">Conectado. Las tablas existen.</div>'; sincronizar(true); }
    catch (e) { $('#s_msg').innerHTML = `<div class="error">${esc(e.message)}<br>Revisa la clave y que hayas corrido el SQL de las tablas.</div>`; }
  };
  $('#s_s').onclick = () => sincronizar();
  $('#u_ab').onchange = e => { UI.abrir = e.target.checked; LS.set('ac_ui', UI); toast(UI.abrir ? 'Fundamentos abiertos' : 'Fundamentos cerrados'); };
  $('#c_g').onclick = () => {
    leerEtapas();
    V().querySelectorAll('[data-ruta]').forEach(i => { const ks = i.dataset.ruta.split('.'); let o = CFG; ks.slice(0, -1).forEach(k => o = o[k]); o[ks[ks.length - 1]] = +i.value; });
    CFG.tizon.usarSmith = $('#smith').checked; CFG._pend = true; guardarCfg(); sincronizar(true); toast('Parámetros guardados');
  };
  $('#c_r').onclick = () => { if (confirm('¿Volver a los valores originales?')) { CFG = clon(M.CONFIG); CFG._pend = true; guardarCfg(); sincronizar(true); vAjustes(); toast('Valores restaurados'); } };
}

// ---------- Inicio ----------
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => { });
estadoNube(nubeLista() ? 'pend' : 'off', nubeLista() ? 'Conectando' : 'Solo local');
ir(vInicio, 'AgroClima LP');
sincronizar(true).then(() => { if (ir._act && ir._act.fn === vInicio && DB.lotes.length) vInicio(); });
window.addEventListener('online', () => sincronizar(true));

</script>
</body>
</html>
