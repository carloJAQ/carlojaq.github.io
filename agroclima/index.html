function quiz(preguntas, titulo, clave) {
  let i = 0, ok = 0;
  const ps = preguntas.map(q => { const ord = barajar(q.o.map((t, k) => ({ t, k }))); return Object.assign({}, q, { ord }); });
  const pintar = () => {
    if (i >= ps.length) {
      const pct = Math.round(100 * ok / ps.length);
      if (clave) { const m = LS.get('ac_quiz', {}); if (m[clave] == null || pct > m[clave]) { m[clave] = pct; LS.set('ac_quiz', m); } }
      V().innerHTML = `<div class="card vacio"><div style="font-size:34px;font-weight:700">${ok} / ${ps.length}</div><div>${pct >= 80 ? 'Muy bien.' : pct >= 50 ? 'Vas bien; repasa las fichas de las que fallaste.' : 'Repasa las fichas y vuelve a intentarlo.'}</div><button class="btn blk" id="q_r" style="margin-top:14px">Otra ronda</button></div>`;
      $('#q_r').onclick = () => quiz(barajar(preguntas), titulo, clave); return;
    }
    const q = ps[i];
    V().innerHTML = `<div class="card"><div class="tiny">${esc(titulo)} · ${i + 1} de ${ps.length}</div><h2 style="margin-top:6px;font-size:16px">${esc(q.p)}</h2>${q.ord.map(o => `<button class="opt" data-k="${o.k}">${esc(o.t)}</button>`).join('')}<div id="q_fb"></div></div>`;
    V().querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const k = +b.dataset.k, bien = k === q.r; if (bien) ok++;
      V().querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.k === q.r) x.classList.add('bien'); else if (x === b) x.classList.add('mal'); });
      $('#q_fb').innerHTML = `<div class="${bien ? 'okmsg' : 'error'}"><b>${bien ? 'Correcto.' : 'No es esa.'}</b> ${esc(q.e)}</div>${q.f ? `<a href="#" class="small" data-ficha="${q.f}">Ver ficha</a>` : ''}<button class="btn blk" id="q_n" style="margin-top:10px">${i + 1 < ps.length ? 'Siguiente' : 'Ver resultado'}</button>`;
      $('#q_n').onclick = () => { i++; pintar(); };
    });
  };
  pintar();
}
function tarjetas(ps) {
  let i = 0, vuelta = false;
  const pintar = () => {
    const q = ps[i];
    V().innerHTML = `<div class="tiny" style="text-align:center;margin-bottom:6px">${i + 1} de ${ps.length} · ${G.CATS[q.cat]}</div>
      <div class="card flash" id="t_c">${vuelta ? `<div class="tiny">Respuesta</div><div style="font-size:17px;font-weight:650;margin:8px 0">${esc(q.o[q.r])}</div><div class="small muted">${esc(q.e)}</div>${q.f ? `<a href="#" class="small" data-ficha="${q.f}">Ver ficha</a>` : ''}` : `<div class="tiny">Pregunta</div><div style="font-size:17px;font-weight:650;margin-top:8px">${esc(q.p)}</div><div class="tiny" style="margin-top:14px">Toca para ver la respuesta</div>`}</div>
      <div class="grid2"><button class="btn sec" id="t_a" ${i ? '' : 'disabled'}>Anterior</button><button class="btn" id="t_s">${i + 1 < ps.length ? 'Siguiente' : 'Volver al inicio'}</button></div>`;
    $('#t_c').onclick = e => { if (e.target.closest('[data-ficha]')) return; vuelta = !vuelta; pintar(); };
    $('#t_a').onclick = () => { i--; vuelta = false; pintar(); };
    $('#t_s').onclick = () => { i = (i + 1) % ps.length; vuelta = false; pintar(); };
  };
  pintar();
}

const nf = (x, d = 2) => x == null || isNaN(x) ? '—' : (Math.round(x * 10 ** d) / 10 ** d).toLocaleString('es-CL');
const calcPq = (como, fund) => porque('cálculo', (como ? `<div class="sub">Cómo se calculó</div><div class="small">${como}</div>` : '') + (fund && fund.length ? `<div class="sub">Por qué importa</div>${fundLista(fund)}` : ''));
function abrirCalc(k) { ir(() => CALC_FN[k](), CALCS[k][0], true); }
function campoN(id, et, val, paso) { return `<div><label>${et}</label><input type="number" step="${paso || 'any'}" id="${id}" value="${val ?? ''}"></div>`; }
const vN = id => { const e = document.getElementById(id); return e && e.value !== '' ? +e.value : null; };
function enVivo(fn) { V().querySelectorAll('input,select').forEach(e => { e.addEventListener('input', fn); e.addEventListener('change', fn); }); fn(); }
function interp(xs, ys, x) { if (x <= xs[0]) return ys[0]; for (let i = 1; i < xs.length; i++) if (x <= xs[i]) return ys[i - 1] + (ys[i] - ys[i - 1]) * (x - xs[i - 1]) / (xs[i] - xs[i - 1]); return ys[ys.length - 1]; }
function interp2(rend, xs, tabla, R, X) { // tabla[rendIndex][xIndex]
  const porR = tabla.map(fila => interp(xs, fila, X));
  return interp(rend, porR, R);
}

// =====================================================================
// IMPORTAR EXCEL DE CULTIVOS
// Lee .xlsx (o .csv) sin librerías: el .xlsx es un zip con XML adentro.
// Columnas mínimas: N° de control, categoría, cultivo y fecha de plantación.
// Opcionales: variedad, potrero/nombre, superficie, latitud, longitud, emergencia, agricultor.
// =====================================================================
const XL = {};
XL.unzip = async function (buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf), out = {};
  let e = -1; for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('El archivo no es un Excel .xlsx válido. Si es .xls antiguo, ábrelo en Excel y guárdalo como .xlsx.');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  const td = new TextDecoder();
  for (let k = 0; k < n; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const met = dv.getUint16(p + 10, true), cs = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nl));
    p += 46 + nl + xl + cl;
    if (!/^xl\/(workbook\.xml|_rels\/workbook\.xml\.rels|sharedStrings\.xml|styles\.xml|worksheets\/[^/]+\.xml)$/.test(name)) continue;
    const ini = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    const data = u8.subarray(ini, ini + cs);
    if (met === 0) out[name] = td.decode(data);
    else if (met === 8) out[name] = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  }
  return out;
};
XL.leer = async function (file) {
  const nom = file.name.toLowerCase();
  if (nom.endsWith('.csv') || nom.endsWith('.txt')) {
    const t = (await file.text()).replace(/^﻿/, '');
    const sep = (t.split('\n')[0].match(/;/g) || []).length >= (t.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
    return t.split(/\r?\n/).filter(x => x.trim()).map(l => l.split(sep).map(c => c.replace(/^"|"$/g, '').trim()));
  }
  const z = await XL.unzip(await file.arrayBuffer()), P = s => new DOMParser().parseFromString(s, 'application/xml');
  const ss = z['xl/sharedStrings.xml'] ? [...P(z['xl/sharedStrings.xml']).getElementsByTagName('si')].map(si => [...si.getElementsByTagName('t')].map(t => t.textContent).join('')) : [];
  // formatos de fecha (para saber qué números son fechas)
  const fechaFmt = new Set();
  if (z['xl/styles.xml']) {
    const st = P(z['xl/styles.xml']), propios = {};
    [...st.getElementsByTagName('numFmt')].forEach(f => propios[f.getAttribute('numFmtId')] = f.getAttribute('formatCode'));
    const xfs = st.getElementsByTagName('cellXfs')[0];
    if (xfs) [...xfs.getElementsByTagName('xf')].forEach((x, i) => { const id = +x.getAttribute('numFmtId'); if ((id >= 14 && id <= 22) || (id >= 45 && id <= 47) || (propios[id] && /[dy]/i.test(propios[id].replace(/"[^"]*"|\[[^\]]*\]/g, '')))) fechaFmt.add(i); });
  }
  // primera hoja según el libro
  let hoja = Object.keys(z).filter(k => k.startsWith('xl/worksheets/')).sort()[0];
  try {
    const wb = P(z['xl/workbook.xml']), rid = wb.getElementsByTagName('sheet')[0].getAttribute('r:id');
    const rel = [...P(z['xl/_rels/workbook.xml.rels']).getElementsByTagName('Relationship')].find(r => r.getAttribute('Id') === rid);
    const t = rel.getAttribute('Target').replace(/^\/?(xl\/)?/, 'xl/'); if (z[t]) hoja = t;
  } catch (e) { }
  if (!hoja) throw new Error('No encontré hojas en el archivo.');
  const filas = [];
  [...P(z[hoja]).getElementsByTagName('row')].forEach(r => {
    const fila = [];
    [...r.getElementsByTagName('c')].forEach(c => {
      const ref = c.getAttribute('r') || '', col = ref.replace(/\d+/g, '').split('').reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1;
      const t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0], s = +c.getAttribute('s');
      let val = '';
      if (t === 's') val = ss[+(v ? v.textContent : 0)] ?? '';
      else if (t === 'inlineStr') val = [...c.getElementsByTagName('t')].map(x => x.textContent).join('');
      else if (v) { val = v.textContent; if (t !== 'str' && t !== 'b' && fechaFmt.has(s) && !isNaN(+val)) val = XL.serial(+val); }
      fila[col >= 0 ? col : fila.length] = String(val).trim();
    });
    filas[(+r.getAttribute('r') || filas.length + 1) - 1] = Array.from(fila, x => x ?? '');
  });
  return Array.from(filas, x => x || []);
};
XL.serial = n => { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 864e5); return d.toISOString().slice(0, 10); };
XL.norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
XL.CAMPOS = [
  ['control', /\bcontrol\b|n ?ctrl|^n ?c$/],
  ['categoria', /categ/],
  ['cultivo', /cultivo|especie/],
  ['variedad', /variedad|cultivar/],
  ['emergencia', /emergen/],
  ['fecha', /plantac|siembra|f plant|fecha p|fecha s/],
  ['superficie', /superficie|\bsup\b|hectar|\bha\b/],
  ['lat', /^lat/], ['lon', /^lon|^lng/],
  ['este', /\beste\b|utm e|^x$|coord x|^e$/], ['norte', /\bnorte\b|utm n|^y$|coord y|^n$/], ['huso', /huso|^zona|^uso$/],
  ['hileras', /hilera/],
  ['estado', /^estado/], ['precedentes', /precedente|cultivo anterior/], ['loteSem', /lote.{0,4}semilla|semilla.{0,6}lote|lote hembra|lote de origen/], ['kgSem', /kg.{0,6}(semilla|sembrad)/],
  ['agricultor', /agricultor|productor|cliente|semillero|multiplicador/],
  ['nombre', /potrero|^lote$|nombre|predio|sector|campo/]

XL.mapear = function (filas) {
  let mejor = { i: -1, n: 0, m: {} };
  for (let i = 0; i < Math.min(20, filas.length); i++) {
    const m = {}; (filas[i] || []).forEach((c, j) => { const h = XL.norm(c); if (!h) return; const f = XL.CAMPOS.find(([k, re]) => !(k in m) && re.test(h)); if (f) m[f[0]] = j; });
    if (!('fecha' in m)) (filas[i] || []).forEach((c, j) => { if (XL.norm(c) === 'fecha' && !Object.values(m).includes(j)) m.fecha = j; });
    const n = Object.keys(m).length; if (n > mejor.n) mejor = { i, n, m };

XL.fecha = function (v) {
  if (v == null || v === '') return null; v = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0, 10);
  if (/^\d{5}(\.\d+)?$/.test(v)) return XL.serial(+v);
  const m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; const d = `${y}-${pad(+m[2])}-${pad(+m[1])}`; return isNaN(new Date(d)) ? null : d; }
  return null;
};
XL.cultivo = function (v, def) {
  const s = XL.norm(v); if (!s) return def;
  if (/papa|patata|solanum/.test(s)) return 'papa'; if (/trigo/.test(s)) return 'trigo'; if (/avena/.test(s)) return 'avena'; if (/cebada/.test(s)) return 'cebada';
  return null;
};
XL.num = v => { if (v == null || v === '') return null; const n = +String(v).replace(/\s/g, '').replace(',', '.'); return isFinite(n) ? n : null; };

      ${x.pend.map(e => `<br><span class="small hoyEv" data-hev="${vHoy._ev.push({ l: x.l, e }) - 1}" style="color:var(--bad)">Pendiente desde ${fFecha(e.fecha)}: ${esc(e.prod)} · ${esc(e.dosis)}</span>`).join('')}
      ${x.prox.map(e => `<br><span class="small hoyEv" data-hev="${vHoy._ev.push({ l: x.l, e }) - 1}">${e.fecha === hoy ? '<b>Hoy</b>' : fFecha(e.fecha)}: ${esc(e.prod)} · ${esc(e.dosis)} <span class="tag">${TIPOS_AP[e.tipo]}</span></span>`).join('')}
      <br><span class="tiny">Próxima ventana: ${fv(x.ven)}</span></span><span class="tiny">›</span></div>`).join('') : '<div class="okmsg">Nada del calendario para hoy ni los próximos 2 días, y nada pendiente de la última semana.</div>'}${filasAp.length ? '<div class="tiny" style="margin-top:6px">Mantén apretada una aplicación para darle visto bueno o quitarla si no se va a aplicar.</div>' : ''}`;
  const fenCard = $('#hoy_fen'); if (fenCard) {
    const bloque = (tit, g) => { if (!g.length) return ''; g.sort((a, b) => b.gd - a.gd); const ad = g[0], at = g[g.length - 1], prom = g.reduce((t, x) => t + x.gd, 0) / g.length;
      const cult = Object.entries(g.reduce((o, x) => (o[x.l.cultivo] = (o[x.l.cultivo] || 0) + 1, o), {})).sort((a, b) => b[1] - a[1])[0][0], ref = g.find(x => x.l.cultivo === cult), ep = M.etapa(prom, ref.l, CFG, ref.gdProm, hoy, 0);
      const fila = (t, x) => `<div class="vent" data-lote="${x.l.id}" style="cursor:pointer"><span><span class="tiny">${t}</span><br><b>${esc(x.l.nombre)}</b>${x.l.numero_control ? ` <span class="tiny">N° ${esc(x.l.numero_control)}</span>` : ''}</span><span class="small" style="text-align:right">${esc(x.et.actual)}<br><span class="tiny">${n0(x.gd)} GD</span></span></div>`;
      return `<h3>${tit} (${g.length} lotes)</h3><div class="row" style="align-items:center;gap:10px"><div class="dibEt">${dibujoEtapa(cult, ep ? ep.i : 0, 56)}</div><div class="grow"><span class="tiny">Promedio</span><br><b>${ep ? esc(ep.actual) : '—'}</b> <span class="tiny">(${n0(prom)} GD${cult !== 'papa' ? ', referencia ' + (CULTIVOS[cult] || cult).toLowerCase() : ''})</span></div></div>${fila('Más avanzado', ad)}${g.length > 1 ? fila('Más atrasado', at) : ''}`; };
    fenCard.innerHTML = `<h2>Estado fenológico</h2>${bloque('Papa', fen.filter(x => x.l.cultivo === 'papa'))}${bloque('Cereales', fen.filter(x => x.l.cultivo !== 'papa'))}<div class="tiny" style="margin-top:4px">El promedio es el de los grados día acumulados de todos los lotes (con el ajuste de terreno si hay visitas). Toca un lote para abrirlo.</div>`;
  }
  $('#hoy_insp').innerHTML = `<h2>Inspecciones SAG que vienen</h2>${insp.length ? insp.sort((a, b) => a.fa.f < b.fa.f ? -1 : 1).map(x => `<div class="vent" data-lote="${x.l.id}" style="cursor:pointer"><span><b>${esc(x.l.nombre)}</b><br><span class="tiny">${esc(x.t)}: ${ventanaTxt(x.fa, x.fb)}</span></span><span class="tag" ${x.ahora ? 'style="border-color:var(--bad);color:var(--bad)"' : ''}>${x.ahora ? 'AHORA' : 'en ' + M.difDias(hoy, x.fa.f) + ' d'}</span></div>`).join('') : '<div class="tiny">Ninguna en las próximas 3 semanas.</div>'}<div class="tiny" style="margin-top:4px">Antes de cada inspección: depurar y revisar el letrero. Las fechas salen de los grados día de cada lote.</div>`;
  if (!ref) { $('#hoy_sem').innerHTML = '<h2>La semana</h2><div class="error">No pude bajar el pronóstico.</div>'; return; }
  const S = CAL.semana(ref.h, hoy, CFG), vmax = CFG.aplicacion.vientoMax;
  const lst = a => a.length ? a.map(d => fFecha(d.f)).join(', ') : 'ninguno';
  $('#hoy_sem').innerHTML = `<h2>La semana</h2><div class="tiny">Pronóstico del punto de ${esc(ref.l.nombre)} (tus lotes están cerca).</div>
    <div class="grid3"><div class="kpi"><b>${S.secos.length}</b><span>días sin lluvia</span></div><div class="kpi"><b>${S.ventosos.length}</b><span>días con viento ≥ ${vmax} km/h</span></div><div class="kpi"><b>${n1(S.total)}</b><span>mm en 7 días</span></div></div>
    <div class="small" style="margin-top:6px"><b>Sin lluvia:</b> ${lst(S.secos)}<br><b>Viento ≥ ${vmax} km/h (no aplicar):</b> ${lst(S.ventosos)}<br><b>Buenos para recorrer (sin lluvia de día):</b> ${lst(S.recorrer)}<br><b>Mejores ventanas para aplicar:</b> ${ref.A.ven.lista.slice(0, 4).map(fv).join(' · ') || 'ninguna en 72 h'}</div>
    <h3>Lluvia por día</h3>${grafico(S.dias.map(d => ({ x: d.f, y: Math.round(d.pp * 10) / 10 })), { tipo: 'barra', unidad: 'mm', titulo: 'Lluvia por día' })}
    <h3>Viento máximo por día</h3>${grafico(S.dias.map(d => ({ x: d.f, y: Math.round(d.vmax) })), { tipo: 'linea', unidad: 'km/h', titulo: 'Viento máximo', color: '#c2512b', marcas: [{ y: vmax, n: `límite ${vmax} km/h` }] })}
    ${porque('', fundLista([['Sobre 25 km/h de viento la deriva lleva el producto fuera del objetivo: no se aplica.', 'general'], ['Los días sin lluvia en horario de trabajo sirven para recorrer, depurar y muestrear sin dañar el cultivo mojado.', 'general'], ['El calendario dice qué toca por días desde plantación; la alerta de tizón dice si el clima realmente lo exige.', 'programas']]))}`;
  V().querySelectorAll('.hoyEv').forEach(el => { el.style.cursor = 'pointer'; mantener(el, () => { const x = vHoy._ev[+el.dataset.hev]; el.closest('[data-lote]')._largo = true; menuEvento(x.l, x.e, () => vHoy()); }); });
  V().querySelectorAll('[data-lote]').forEach(e => e.onclick = () => { if (e._largo) { e._largo = false; return; } const l = DB.lotes.find(x => x.id === e.dataset.lote); ir(() => vLote(l.id), l.nombre, true); });
}

// ---------- Vista: Clima aquí (GPS actual) ----------
async function vAqui() {
  V().innerHTML = `<div class="card vacio"><span class="spin"></span> Buscando tu ubicación…</div>`;
  let p;
  try { p = await pedirGPS(); }
  catch (e) { V().innerHTML = `<div class="error">${esc(e.message)}</div><button class="btn blk" id="re">Reintentar</button>`; $('#re').onclick = vAqui; return; }
  V().innerHTML = `<div class="card vacio"><span class="spin"></span> Descargando pronóstico…</div>`;
  try {
    const h = await traerClima(p.lat, p.lon, M.sumarDias(hoyStr(), -1), 4);
    const ven = M.ventanas(h, ahoraStr(), CFG, 72);
    const dias = M.diario(h, CFG).filter(d => d.fecha >= hoyStr());
    V().innerHTML = `<div class="card"><div class="small muted">Punto ${p.lat}, ${p.lon} (± ${p.prec} m) · <a href="https://www.google.com/maps?q=${p.lat},${p.lon}" target="_blank" rel="noopener">mapa</a></div>
      <h2 style="margin-top:8px">¿Se puede aplicar aquí?</h2>${htmlAhora(ven)}<h3>Ventanas próximas 72 h</h3>${htmlVentanas(ven)}</div>
      <div class="card"><h2>Pronóstico</h2><table class="tabla"><tr><th>Día</th><th>Mín</th><th>Máx</th><th>mm</th><th>Viento máx</th><th>Ráfagas</th></tr>${dias.map(d => `<tr><td>${fFecha(d.fecha)}</td><td>${n0(d.tmin)}°</td><td>${n0(d.tmax)}°</td><td>${n1(d.pp)}</td><td>${n0(d.viento)}</td><td>${n0(d.rafaga)}</td></tr>`).join('')}</table></div>
      <button class="btn sec blk" id="crear">Crear lote en este punto</button>`;
    $('#crear').onclick = () => { ir(() => { vLoteForm(null); $('#f_lat').value = p.lat; $('#f_lon').value = p.lon; $('#f_lat').oninput(); }, 'Nuevo lote', true); };
  } catch (e) { V().innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}

// ---------- Vista: Ajustes ----------
function campo(ruta, etiqueta, paso) {
  const v = ruta.split('.').reduce((o, k) => o[k], CFG);
  return `<div><label>${etiqueta}</label><input type="number" step="${paso || 1}" data-ruta="${ruta}" value="${v}"></div>`;
}
function vAjustes() {
  V().innerHTML = `<div class="card"><h2>Notificaciones</h2><div class="small">Avisos en este teléfono todos los días temprano (07:13): qué aplicar según el calendario, inspecciones SAG que vienen y cómo viene la semana (lluvia y viento).</div><div id="push_box"></div></div>
    <div class="card"><h2>IA para fotos (gratis)</h2><div class="small">Para que la app interprete las fotos de la planta usa Gemini de Google en su nivel gratuito. Necesitas una clave propia: entra a <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> con tu cuenta Gmail, crea la clave y pégala aquí. No pide tarjeta.</div>
    <label>Clave de Gemini</label><input id="ia_key" value="${esc(IA.key || '')}" placeholder="AIza…" autocomplete="off">
    <label>Modelo</label><input id="ia_mod" value="${esc(IA.modelo || IA_MODELO_DEF)}">
    <div class="tiny">La clave queda solo en este teléfono. En el nivel gratuito Google puede usar las fotos para mejorar sus productos: no envíes fotos con datos privados.</div>
    <button class="btn sec blk" id="ia_ok" style="margin-top:8px">Guardar clave</button><div id="ia_msg"></div></div>
    <div class="card"><h2>Aprendizaje</h2><label class="chk"><input type="checkbox" id="u_ab" ${UI.abrir ? 'checked' : ''}>Mostrar siempre abiertos los "¿Por qué?"</label><div class="tiny">Cada decisión trae el paso a paso con tus datos y el fundamento técnico. Si lo desmarcas, quedan cerrados y los abres al tocar.</div></div>
    <div class="card"><h2>Nube (Supabase)</h2>
    <label>URL del proyecto</label><input id="s_url" value="${esc(SB.url)}">
    <label>Clave pública (anon key)</label><input id="s_key" value="${esc(SB.key)}" placeholder="eyJhbGciOi…">
    <div class="tiny" style="margin-top:4px">Está en Supabase → Project Settings → API → anon public. Es la misma de la app Registro LP.</div>
    <div class="row" style="margin-top:10px"><button class="btn grow" id="s_g">Guardar y probar</button><button class="btn sec grow" id="s_s">Sincronizar</button></div><div id="s_msg"></div></div>

    <div class="card"><h2>Criterios de aplicación</h2><div class="grid2">
    ${campo('aplicacion.vientoMax', 'Viento máximo (km/h)')}${campo('aplicacion.horasSinLluvia', 'Horas sin lluvia después')}
    ${campo('aplicacion.tempMin', 'Temperatura mínima (°C)')}${campo('aplicacion.tempMax', 'Temperatura máxima (°C)')}
    ${campo('aplicacion.horaIni', 'Hora inicio')}${campo('aplicacion.horaFin', 'Hora término')}
    ${campo('aplicacion.horasMinVentana', 'Horas mínimas de ventana')}${campo('aplicacion.lluviaMinima', 'Lluvia que cuenta (mm)', 0.1)}</div></div>

    <div class="card"><h2>Protección de productos</h2><div class="tiny">Días que protege y lluvia acumulada que lo lava (0 = no se lava).</div>
    ${Object.keys(TIPOS).map(t => `<div class="grid2">${campo(`proteccion.${t}.dias`, `${TIPOS[t]}: días`)}${campo(`proteccion.${t}.lavadoMm`, `${TIPOS[t]}: lavado (mm)`)}</div>`).join('')}</div>

    <div class="card"><h2>Tizón tardío</h2><div class="grid2">
    ${campo('tizon.inicioVS', 'Severidad para iniciar programa')}${campo('tizon.inicioDiasLluviosos', 'o días favorables seguidos')}
    ${campo('tizon.intervaloAlto', 'Intervalo riesgo alto (días)')}${campo('tizon.intervaloMedio', 'Intervalo riesgo medio (días)')}</div>
    <label class="chk"><input type="checkbox" id="smith" ${CFG.tizon.usarSmith ? 'checked' : ''}>Usar también el período Smith</label></div>

    <div class="card"><h2>Tizón temprano (Alternaria)</h2><div class="grid2">
    ${campo('alternaria.inicioPdias', 'P-días para iniciar')}${campo('alternaria.fast7Alto', 'FAST 7 días: alto')}${campo('alternaria.fast7Medio', 'FAST 7 días: medio')}</div></div>

    <div class="card"><h2>Botritis</h2><div class="grid2">
    ${campo('botritis.hrMin', 'HR mínima (%)')}${campo('botritis.horasDiaFavorable', 'Horas/día favorables')}
    ${campo('botritis.tMin', 'T mínima (°C)')}${campo('botritis.tMax', 'T máxima (°C)')}${campo('botritis.diasAlto', 'Días favorables = alto')}</div></div>

    <div class="card"><h2>Pulgones de cereales (BYDV)</h2><div class="grid2">
    ${campo('pulgonesCereal.base', 'Temperatura base (°C)', 0.5)}${campo('pulgonesCereal.umbral', 'GD para la segunda generación')}</div></div>

    <div class="card"><h2>Etapas fenológicas (grados día)</h2>
    <select id="e_c">${Object.entries(CULTIVOS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
    <div id="e_box" class="etapas-ed"></div></div>

    <div class="row" style="margin-bottom:12px"><button class="btn grow" id="c_g">Guardar parámetros</button><button class="btn sec" id="c_r">Restaurar</button></div>
    <details class="card"><summary>Cómo calcula la app</summary><div class="small" style="margin-top:8px">
    <p><b>Clima:</b> datos horarios de Open-Meteo para el punto GPS (pasado desde la plantación y pronóstico 7 días). Tu pluviómetro reemplaza la lluvia del día.</p>
    <p><b>Grados día:</b> por hora (método INIFAP), sumando T − base entre la base y el tope, desde la plantación o siembra. Papa: base 2 °C y tope 29 °C; cereales: base 0 °C. Las etapas del sur son estimadas: ajústalas con tus registros.</p>
    <p><b>Pulgones de cereales:</b> 170 GD sobre 3 °C desde la emergencia o la última aplicación (IRAG).</p>
    <p><b>Balance hídrico:</b> lluvia menos ET₀ × Kc (FAO-56).</p>
    <p><b>Tizón tardío:</b> valores de severidad de Wallin (horas con HR ≥ 90 % y su temperatura) y matriz Blitecast con días favorables por lluvia. Se inicia al llegar a 18 de severidad desde emergencia. Además marca el período Smith: 2 días seguidos con mínima ≥ 10 °C y 6 h o más con HR ≥ 90 %.</p>
    <p><b>Tizón temprano:</b> P-días (Sands) desde emergencia; inicia a los 300. Luego mide la severidad FAST de los últimos 7 días.</p>
    <p><b>Botritis:</b> cuenta horas con HR ≥ 90 % y 12–25 °C. Un día es favorable con 10 h o más.</p>
    <p><b>Protección:</b> la última aplicación protege por los días del tipo de producto, salvo que la lluvia acumulada la lave.</p>
    <p><b>Ventana:</b> horas con viento bajo el máximo (25 km/h), sin lluvia en las horas siguientes y temperatura dentro del rango.</p>
    <p class="tiny">Es un apoyo a la decisión, no reemplaza el monitoreo en terreno.</p></div></details>`;
  const pintarEtapas = () => {
    const c = $('#e_c').value, cu = CFG[c];
    $('#e_box').innerHTML = `<div class="grid2"><div><label>Temperatura base (°C)</label><input type="number" step="0.5" id="e_base" value="${cu.base}"></div><div><label>Temperatura tope (°C)</label><input type="number" step="0.5" id="e_tope" value="${cu.tope ?? ''}"></div></div>
      <div class="tiny">Grados día por hora (método INIFAP): suma T − base entre la base y el tope.</div>
      ${c === 'papa' ? '<button class="btn sec blk" id="e_inifap" style="margin-top:8px">Usar etapas INIFAP (Sinaloa, Alpha)</button><button class="btn sec blk" id="e_sur" style="margin-top:8px">Volver a etapas estimadas del sur</button>' : ''}
      <label>Etapas (nombre y GD acumulados)</label>${cu.etapas.map((e, i) => `<div class="row"><input class="grow" data-en="${i}" value="${esc(e.n)}"><input style="width:90px" type="number" data-eg="${i}" value="${e.gd}"></div>`).join('')}
      <div class="row"><button class="btn sec grow" id="e_add">+ Etapa</button><button class="btn sec grow" id="e_del">− Última</button></div>`;
    if (c === 'papa') {
      $('#e_inifap').onclick = () => { cu.base = 2; cu.tope = 29; cu.etapas = clon(M.PRESET_INIFAP_ALPHA); pintarEtapas(); toast('Etapas INIFAP cargadas: recuerda Guardar'); };
      $('#e_sur').onclick = () => { cu.base = M.CONFIG.papa.base; cu.tope = M.CONFIG.papa.tope; cu.etapas = clon(M.CONFIG.papa.etapas); pintarEtapas(); toast('Etapas del sur cargadas: recuerda Guardar'); };
    }
    $('#e_add').onclick = () => { leerEtapas(); cu.etapas.push({ n: 'Nueva etapa', gd: (cu.etapas[cu.etapas.length - 1] || { gd: 0 }).gd + 100 }); pintarEtapas(); };
    $('#e_del').onclick = () => { leerEtapas(); if (cu.etapas.length > 2) cu.etapas.pop(); pintarEtapas(); };
  };
  const leerEtapas = () => {
    const c = $('#e_c').value, cu = CFG[c]; if (!$('#e_base')) return;
    cu.base = +$('#e_base').value; cu.tope = $('#e_tope').value === '' ? null : +$('#e_tope').value;
    cu.etapas = cu.etapas.map((e, i) => ({ n: (document.querySelector(`[data-en="${i}"]`) || {}).value || e.n, gd: +((document.querySelector(`[data-eg="${i}"]`) || {}).value ?? e.gd) })).sort((a, b) => a.gd - b.gd);
  };
  let cAct = 'papa';
  $('#e_c').onchange = () => { const nuevo = $('#e_c').value; $('#e_c').value = cAct; leerEtapas(); $('#e_c').value = nuevo; cAct = nuevo; pintarEtapas(); };
  pintarEtapas();
  $('#s_g').onclick = async () => {
    SB = { url: $('#s_url').value.trim(), key: $('#s_key').value.trim() }; LS.set('ac_sb', SB);
    $('#s_msg').innerHTML = '<div class="tiny"><span class="spin"></span> Probando…</div>';
    try { await sb('GET', 'ac_lotes?select=id&limit=1'); $('#s_msg').innerHTML = '<div class="okmsg">Conectado. Las tablas existen.</div>'; sincronizar(true); }
    catch (e) { $('#s_msg').innerHTML = `<div class="error">${esc(e.message)}<br>Revisa la clave y que hayas corrido el SQL de las tablas.</div>`; }
  };
  $('#s_s').onclick = () => sincronizar();
  $('#ia_ok').onclick = () => { IA = { key: $('#ia_key').value.trim(), modelo: $('#ia_mod').value.trim() || IA_MODELO_DEF }; LS.set('ac_ia', IA); $('#ia_msg').innerHTML = `<div class="okmsg">${IA.key ? 'Clave guardada.' : 'Clave borrada.'}</div>`; };
  pintarPush('#push_box');
  $('#u_ab').onchange = e => { UI.abrir = e.target.checked; LS.set('ac_ui', UI); toast(UI.abrir ? 'Fundamentos abiertos' : 'Fundamentos cerrados'); };
  $('#c_g').onclick = () => {
    leerEtapas();
    V().querySelectorAll('[data-ruta]').forEach(i => { const ks = i.dataset.ruta.split('.'); let o = CFG; ks.slice(0, -1).forEach(k => o = o[k]); o[ks[ks.length - 1]] = +i.value; });
    CFG.tizon.usarSmith = $('#smith').checked; CFG._pend = true; guardarCfg(); sincronizar(true); toast('Parámetros guardados');
  };
  $('#c_r').onclick = () => { if (confirm('¿Volver a los valores originales?')) { CFG = clon(M.CONFIG); CFG._pend = true; guardarCfg(); sincronizar(true); vAjustes(); toast('Valores restaurados'); } };
}

// ---------- Inicio ----------
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => { });
estadoNube(nubeLista() ? 'pend' : 'off', nubeLista() ? 'Conectando' : 'Solo local');
if (location.hash === '#hoy') { history.replaceState(null, '', location.pathname); pila = [{ fn: vInicio, titulo: 'AgroClima LP' }]; ir._act = { fn: vHoy, titulo: 'Hoy' }; $('#titulo').textContent = 'Hoy'; $('#btnAtras').style.display = ''; vHoy(); }
else ir(vInicio, 'AgroClima LP');
sincronizar(true).then(() => { if (ir._act && ir._act.fn === vInicio && DB.lotes.length) vInicio(); });
if (navigator.serviceWorker) navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.abrir === 'hoy') ir(vHoy, 'Hoy', true); if (e.data && e.data.abrir === 'mensajes') ir(vMensajes, 'Mensajes', true); });
if (location.hash === '#mensajes') { history.replaceState(null, '', location.pathname); pila = [{ fn: vInicio, titulo: 'AgroClima LP' }]; ir._act = { fn: vMensajes, titulo: 'Mensajes' }; $('#titulo').textContent = 'Mensajes'; $('#btnAtras').style.display = ''; vMensajes(); }
window.addEventListener('online', () => sincronizar(true));

</script>
